name: native-share-software
on:
  workflow_dispatch:
  pull_request:
    paths: ['mobile/ios/**', 'scripts/*ios*.py', 'scripts/native_bundle.py', 'scripts/verify-shared-text.py', 'tests/test_ios*.py', '.github/workflows/native-share.yml']
permissions:
  contents: read
jobs:
  native-share:
    # GitHub's standard Xcode 27 image; no paid xlarge runner.
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Install pinned public dependencies
        run: |
          python -m pip install --require-hashes -r eval/requirements.lock
          npm ci
          npm ci --prefix site
      - name: Prepare exact public method and runtime assets
        run: node site/scripts/prepare-device.mjs
      - name: Use a private workspace outside source
        run: |
          workspace="$(mktemp -d "$RUNNER_TEMP/aitrust-native.XXXXXXXX")"
          printf 'AITRUST_NATIVE_PROOF=%s\n' "$workspace" >> "$GITHUB_ENV"
      - name: Exercise provider admission and stale delivery refusals
        run: python scripts/verify-shared-text.py --output "$AITRUST_NATIVE_PROOF/text"
      - name: Exercise current Share workflow on an owned simulator
        run: |
          runtime="$(xcrun simctl list runtimes --json | python scripts/select-ios-runtime.py)"
          python scripts/verify-ios-share.py --output "$AITRUST_NATIVE_PROOF/share" --runtime "$runtime"
      - name: Build and inspect the unsigned registered-ID device archive
        run: python scripts/verify-ios-archive.py --output "$AITRUST_NATIVE_PROOF/archive"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-share-software-proof
          path: |
            ${{ env.AITRUST_NATIVE_PROOF }}/text/proof.json
            ${{ env.AITRUST_NATIVE_PROOF }}/share/proof.json
            ${{ env.AITRUST_NATIVE_PROOF }}/share/*.log
            ${{ env.AITRUST_NATIVE_PROOF }}/archive/proof.json
            ${{ env.AITRUST_NATIVE_PROOF }}/archive/archive.log
          retention-days: 7
