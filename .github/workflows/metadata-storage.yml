name: synthetic-metadata-storage
on:
  push:
    paths:
      - 'deploy/audit/**'
      - 'tools/organization_audit*.py'
      - 'scripts/*organization-audit*.py'
      - 'spec/organization-audit-metadata.schema.json'
      - 'tests/test_organization_audit.py'
      - 'deploy/research/**'
      - 'scripts/metadata-store-sandbox.py'
      - 'scripts/verify-metadata-store.py'
      - 'scripts/verify-research-invitations.py'
      - 'tools/research_admission.py'
      - 'tools/blind_review_io.py'
      - 'services/research/**'
      - 'scripts/worker_process.py'
      - 'scripts/verify-research-http.py'
      - 'tests/test_research_http*.py'
      - '.github/workflows/ci.yml'
      - 'services/gateway/requirements.lock'
      - 'scripts/research-admission.py'
      - 'scripts/verify-research-admission.py'
      - 'tests/test_research_admission.py'
      - 'tests/test_metadata_store.py'
      - 'tests/test_research_invitations.py'
      - 'site/src/research-feedback.js'
      - 'protocol/reports.py'
      - 'eval/requirements.lock'
      - '.github/workflows/metadata-storage.yml'
  pull_request:
    paths:
      - 'deploy/audit/**'
      - 'tools/organization_audit*.py'
      - 'scripts/*organization-audit*.py'
      - 'spec/organization-audit-metadata.schema.json'
      - 'tests/test_organization_audit.py'
      - 'deploy/research/**'
      - 'scripts/metadata-store-sandbox.py'
      - 'scripts/verify-metadata-store.py'
      - 'scripts/verify-research-invitations.py'
      - 'tools/research_admission.py'
      - 'tools/blind_review_io.py'
      - 'services/research/**'
      - 'scripts/worker_process.py'
      - 'scripts/verify-research-http.py'
      - 'tests/test_research_http*.py'
      - '.github/workflows/ci.yml'
      - 'services/gateway/requirements.lock'
      - 'scripts/research-admission.py'
      - 'scripts/verify-research-admission.py'
      - 'tests/test_research_admission.py'
      - 'tests/test_metadata_store.py'
      - 'tests/test_research_invitations.py'
      - 'site/src/research-feedback.js'
      - 'protocol/reports.py'
      - 'eval/requirements.lock'
      - '.github/workflows/metadata-storage.yml'
permissions:
  contents: read
jobs:
  postgres-synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '24' }
      - name: Install the existing hash-pinned verification dependencies
        run: python -m pip install --require-hashes -r eval/requirements.lock -r services/gateway/requirements.lock
      - name: Verify private request and website metadata contracts
        run: python -m pytest -q tests/test_research_admission.py tests/test_research_invitations.py tests/test_metadata_store.py tests/test_research_http.py
      - name: Install PostgreSQL 18 from the fingerprint-checked official repository
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y ca-certificates curl gnupg postgresql-common
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /tmp/aitrust-pgdg.asc
          fingerprint=$(gpg --show-keys --with-colons /tmp/aitrust-pgdg.asc | awk -F: '$1=="fpr" { print $10; exit }')
          test "$fingerprint" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          sudo install -m 0644 /tmp/aitrust-pgdg.asc /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          printf '%s\n' 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/aitrust-pgdg.list >/dev/null
          printf '\ncreate_main_cluster = false\n' | sudo tee -a /etc/postgresql-common/createcluster.conf >/dev/null
          sudo apt-get update -q
          sudo apt-get install -y postgresql-18 postgresql-client-18 pgbackrest
      - name: Run actual storage controls as the ordinary runner, private socket only
        run: python scripts/metadata-store-sandbox.py --output output/verification/metadata-store.json
      - name: Run separately applied invitation capacity, role and replay controls
        run: python scripts/metadata-store-sandbox.py --profile invitation --output output/verification/research-invitations.json
      - name: Run separately applied private request admission and withdrawal controls
        run: python scripts/metadata-store-sandbox.py --profile admission --output output/verification/research-admission.json
      - name: Run actual loopback HTTP admission, database quota, withdrawal and replay controls
        run: python scripts/metadata-store-sandbox.py --profile http --output output/verification/research-http.json
      - name: Execute independent organization audit storage and encrypted recovery controls
        run: sudo unshare --net -- "$(command -v python)" scripts/verify-organization-audit.py --run-as "$(id -un)" --output output/verification/organization-audit.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: synthetic-metadata-storage
          path: |
            output/verification/organization-audit.json
            output/verification/metadata-store.json
            output/verification/research-invitations.json
            output/verification/research-admission.json
            output/verification/research-http.json
          if-no-files-found: error
