name: nf-browser-diagnostic
on:
  push:
    branches: [codex/nf-browser-diagnostic]
permissions:
  contents: read
jobs:
  nf-browser-diagnostic:
    if: github.repository == 'knwvmbrr/aitrust-id' && github.ref == 'refs/heads/codex/nf-browser-diagnostic'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AITRUST_VERIFY_PYTHON: python3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - run: pip install --require-hashes -r services/gateway/requirements.lock
      - run: pip install --require-hashes -r eval/requirements.lock
      - run: npm ci
      - run: npm ci --prefix site
      - name: Prepare the same signed canonical Ubuntu archive as the site job
        env:
          AITRUST_CI_RUNNER_ENV: ${{ runner.environment }}
          AITRUST_CI_RUNNER_OS: ${{ runner.os }}
        run: |
          aitrust_apt_dir="$(mktemp -d "$RUNNER_TEMP/aitrust-apt.XXXXXXXX")"
          AITRUST_CI_SOURCE_DIR="$aitrust_apt_dir" python3 scripts/ci-ubuntu-mirror.py --output "$aitrust_apt_dir/aitrust-ubuntu.sources"
          sudo install -o root -g root -m 0644 -- "$aitrust_apt_dir/aitrust-ubuntu.sources" /etc/apt/sources.list.d/ubuntu.sources
      - run: npx playwright install --with-deps chromium webkit
        timeout-minutes: 15
      - name: Verify closed process and stage diagnostics
        run: node --test tests/nf-browser-diagnostics.cjs
      - name: Execute unchanged bounded NF browser entrypoint once
        run: node scripts/verify-nf-client.cjs
      - name: Retain only selected safe NF diagnostic records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nf-browser-fixed-diagnostics
          path: |
            output/verification/nf-client-diagnostic.json
            output/verification/nf-device-stage.json
            output/verification/nf-device-browser.json
          if-no-files-found: warn
          retention-days: 7
