name: visual-score-reference-qualification
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed 40-character commit SHA; not acquisition approval by itself
        required: true
        type: string
permissions:
  contents: read
jobs:
  visual-score-reference-qualification:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'knwvmbrr/aitrust-id' && github.ref == 'refs/heads/codex/nov23-image-native-qualification' && inputs.expected_commit == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 2
        with: {persist-credentials: false}
      - name: Refuse unreviewed dispatch identity before qualification setup
        timeout-minutes: 1
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          python3 -I -S -B - <<'PY_IDENTITY'
          import os,re,subprocess
          expected=os.environ.get('EXPECTED_COMMIT','')
          valid=(re.fullmatch(r'[0-9a-f]{40}',expected) is not None
                 and expected==os.environ.get('GITHUB_SHA')
                 and os.environ.get('GITHUB_EVENT_NAME')=='workflow_dispatch'
                 and os.environ.get('GITHUB_REPOSITORY')=='knwvmbrr/aitrust-id'
                 and os.environ.get('GITHUB_REF')=='refs/heads/codex/nov23-image-native-qualification')
          if not valid:raise SystemExit('Qualification identity refused.')
          try:actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True,stderr=subprocess.DEVNULL,timeout=5).strip()
          except (OSError,subprocess.SubprocessError):raise SystemExit('Qualification identity refused.') from None
          if actual!=expected:raise SystemExit('Qualification identity refused.')
          PY_IDENTITY
          # Initialize the one nonextending operator budget in this same bounded step.
          set -eu
          umask 077
          reports="$RUNNER_TEMP/visual-score-reports-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          workspace="$RUNNER_TEMP/visual-score-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$workspace"
          mkdir -m 700 "$reports"
          budget_sha=$(/usr/bin/python3 -I -S -B scripts/run-visual-score-phase.py start --reports "$reports" --source-commit "$GITHUB_SHA")
          echo "VISUAL_REPORTS=$reports" >> "$GITHUB_ENV"
          echo "VISUAL_WORKSPACE=$workspace" >> "$GITHUB_ENV"
          echo "VISUAL_BUDGET_SHA=$budget_sha" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        timeout-minutes: 2
        with: {python-version: '3.13'}
      - name: Verify source-only controls in the remaining work window
        run: |
          set -eu
          base_python=$(command -v python)
          echo "VISUAL_BASE_PYTHON=$base_python" >> "$GITHUB_ENV"
          env -i PATH=/usr/bin:/bin "$base_python" -I -S -B scripts/run-visual-score-phase.py run --phase source --reports "$VISUAL_REPORTS" --workspace "$VISUAL_WORKSPACE" --python "$base_python" --base-python "$base_python" --budget-sha "$VISUAL_BUDGET_SHA"
      - name: Acquire fixed public bytes within the original shared budget
        run: |
          set -eu
          env -i PATH=/usr/bin:/bin "$VISUAL_BASE_PYTHON" -I -S -B scripts/run-visual-score-phase.py run --phase acquire --reports "$VISUAL_REPORTS" --workspace "$VISUAL_WORKSPACE" --python "$VISUAL_BASE_PYTHON" --base-python "$VISUAL_BASE_PYTHON" --budget-sha "$VISUAL_BUDGET_SHA"
      - name: Offline private install and fixtures after privilege drop
        run: |
          set -eu
          outside=$(readlink /proc/self/ns/net)
          for phase in install fixtures; do
            interpreter="$VISUAL_BASE_PYTHON"
            if test "$phase" = fixtures; then interpreter="$VISUAL_WORKSPACE/venv/bin/python"; fi
            sudo unshare -n sh -c 'set -eu
            test "$(readlink /proc/self/ns/net)" != "$5"
            exec setpriv --reuid "$1" --regid "$2" --clear-groups --no-new-privs --bounding-set=-all --inh-caps=-all --ambient-caps=-all env -i PATH=/usr/bin:/bin "$3" -I -S -B scripts/run-visual-score-phase.py run --phase "$8" --reports "$7" --workspace "$4" --python "$9" --base-python "$3" --budget-sha "${10}"' _ "$(id -u)" "$(id -g)" "$VISUAL_BASE_PYTHON" "$VISUAL_WORKSPACE" "$outside" reserved "$VISUAL_REPORTS" "$phase" "$interpreter" "$VISUAL_BUDGET_SHA"
          done
          env -i PATH=/usr/bin:/bin "$VISUAL_BASE_PYTHON" -I -S -B scripts/run-visual-score-phase.py run --phase seal --reports "$VISUAL_REPORTS" --workspace "$VISUAL_WORKSPACE" --python "$VISUAL_BASE_PYTHON" --base-python "$VISUAL_BASE_PYTHON" --budget-sha "$VISUAL_BUDGET_SHA"
      - name: Actual isolated CPU and reference within remaining work time
        run: |
          set -eu
          outside=$(readlink /proc/self/ns/net)
          sudo unshare -n sh -c 'set -eu
          test "$(readlink /proc/self/ns/net)" != "$5"
          exec setpriv --reuid "$1" --regid "$2" --clear-groups --no-new-privs --bounding-set=-all --inh-caps=-all --ambient-caps=-all env -i PATH=/usr/bin:/bin VISUAL_QUAL_OUTER_NETNS="$5" "$3" -I -S -B scripts/run-visual-score-phase.py run --phase forward --reports "$6" --workspace "$4" --python "$4/venv/bin/python" --base-python "$3" --budget-sha "$7"' _ "$(id -u)" "$(id -g)" "$VISUAL_BASE_PYTHON" "$VISUAL_WORKSPACE" "$outside" "$VISUAL_REPORTS" "$VISUAL_BUDGET_SHA"
      - name: Always attempt owned cleanup using original budget and system stdlib
        if: always()
        run: |
          set -eu
          reports="$RUNNER_TEMP/visual-score-reports-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          workspace="$RUNNER_TEMP/visual-score-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test -n "${VISUAL_BUDGET_SHA:-}"
          env -i PATH=/usr/bin:/bin /usr/bin/python3 -I -S -B scripts/run-visual-score-phase.py run --phase cleanup --reports "$reports" --workspace "$workspace" --python /usr/bin/python3 --base-python /usr/bin/python3 --budget-sha "$VISUAL_BUDGET_SHA"
      - name: Always retain missing failure observations without adopting a stage
        if: always()
        run: |
          set -eu
          reports="$RUNNER_TEMP/visual-score-reports-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if test ! -e "$reports"; then mkdir -m 700 "$reports"; fi
          env -i PATH=/usr/bin:/bin /usr/bin/python3 -I -S -B scripts/run-visual-score-phase.py fallback --reports "$reports"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        timeout-minutes: 2
        with:
          name: visual-score-reference-qualification
          path: |
            ${{ runner.temp }}/visual-score-reports-${{ github.run_id }}-${{ github.run_attempt }}/qualification.json
            ${{ runner.temp }}/visual-score-reports-${{ github.run_id }}-${{ github.run_attempt }}/cleanup.json
          if-no-files-found: error
          retention-days: 7
