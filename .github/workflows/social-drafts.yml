name: social-drafts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/build-social-drafts.py', '.github/workflows/social-drafts.yml']
  pull_request:
    paths: ['scripts/build-social-drafts.py', '.github/workflows/social-drafts.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare drafts from live canonical pages
        run: |
          python3 scripts/build-social-drafts.py > "$RUNNER_TEMP/aitrust-social-drafts.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai-trust-id-social-drafts
          path: ${{ runner.temp }}/aitrust-social-drafts.json
          if-no-files-found: error
          retention-days: 14
