name: ci
on: [push, pull_request]
permissions:
  contents: read

env:
  AITRUST_CHANGELOG_DEFAULT_REF: refs/remotes/origin/${{ github.event.repository.default_branch }}
  AITRUST_CHANGELOG_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
jobs:
  change-records:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Exercise change record failure cases
        run: python3 -m unittest discover -s tests -p test_changelog_pipeline.py -v
      - name: Require records for the actual push or PR changes
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/verify-changelog.py --base "$EVENT_BASE" --head HEAD

  host-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: make host-build
      - run: shellcheck -e SC1091 deploy/host/bootstrap.sh deploy/host/deploy.sh deploy/host/verify.sh
      - run: make backup-build
      - name: Refuse unsafe restore boundaries before secrets or filesystem changes
        run: |
          sudo python3 tests/restore_isolation_kernel.py host
          sudo unshare --net -- python3 tests/restore_isolation_kernel.py isolated
      - run: shellcheck -e SC1091 deploy/backup/bootstrap.sh deploy/backup/deploy.sh deploy/backup/verify.sh deploy/backup/schedule.sh deploy/backup/source-monitor.sh
      - run: make alerts-build
      - run: shellcheck deploy/alerts/install.sh
      - run: make notifications-build
      - run: shellcheck deploy/notifications/install.sh deploy/notifications/prepare-edge.sh deploy/notifications/activate-edge.sh
      # Live host verification is explicitly separate; CI has no production key.

  scope-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/verify-scope-plan.py
      - run: python scripts/scope-progress.py
      - run: python scripts/verify-accountability.py
      - name: Bind the actual clean Linux setup without granting human/tag acceptance
        run: python scripts/verify-local-setup-evidence.py
      - run: python scripts/verify-decisions.py
      - name: Keep the approved metadata pilot disabled until operational gates pass
        run: python scripts/verify-research-policy.py
      - run: python scripts/verify-signals.py --check
      - name: Resolve legacy group jobs without completing their detectors
        run: python scripts/verify-scope-groups.py
      - name: Exercise independent offline observation CLIs without executing inspected programs
        run: python scripts/verify-independent-observations.py
      - name: Exercise bounded quantitative CLI privacy and failure controls
        run: python scripts/verify-quantitative-observations.py --output output/verification/quantitative-cli.json
      - name: Exercise bounded nominal agreement without real labels or automatic submission
        run: python scripts/verify-reviewer-agreement.py --output output/verification/reviewer-agreement-cli.json
      - run: python scripts/verify-project-controls.py
      - name: Verify unsigned observed runtime SBOM identity
        run: python scripts/verify-runtime-sbom.py
      - name: Verify accountable ownership and bounded dependency proposals
        run: python scripts/verify-dependency-automation.py
      - name: Refuse missing roots and unsafe dependency policy changes
        run: python -m unittest discover -s tests -p test_dependency_automation.py -v
      - run: python scripts/verify-vocabulary.py
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Validate source-bound service timing and refuse altered measurements
        run: node --test tests/pipeline-timing.cjs
      - run: make verify-primitives
      - run: python scripts/verify-reserved-subjects.py
      - run: python scripts/verify-hash-disclosure.py

  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r services/gateway/requirements.lock
      - run: pip install --require-hashes -r eval/requirements.lock
      - run: python -m pytest tests/test_gateway_integration.py -q
      - name: Keep tag routes independent under real HTTP saturation and worker failures
        run: |
          python -m pytest tests/test_tag_failure_isolation.py tests/test_gateway_runtime_isolation.py tests/test_standalone_ps.py tests/test_independent_tag_batch.py tests/test_tag_isolation_verifier.py tests/test_gateway_cancellation.py tests/test_draft_privacy.py -q
          python scripts/verify-standalone-ps.py --output output/verification/standalone-ps.json
      - name: Exercise protected restore generation and namespace refusal cases
        run: python -m pytest tests/test_restore_isolation.py tests/test_backup_protocol.py -q
      - name: Refuse invalid experimental confidence without granting evidence standing
        run: python -m pytest tests/test_adjudicator_confidence.py tests/test_adjudicator.py tests/test_adjudicator_boundaries.py -q
      - name: Preserve PS findings while refusing unnecessary context work
        run: python -m pytest tests/test_lazy_ps_context.py tests/test_command_performance.py tests/test_ps_efficiency_evidence.py -q
      - name: Enforce commercial-interest recusal without asserting real governance
        run: make verify-recusal
      - run: python scripts/verify-verdict-boundaries.py
      - run: python scripts/verify-dependencies.py
      - name: Check preserved component notice identity without claiming legal clearance
        run: python scripts/verify-redistribution-notices.py
      - name: Verify native observations without claiming transitive or license clearance
        run: python scripts/verify-native-dependencies.py
      - name: Refuse corrupted notice evidence and permission promotion
        run: python -m pytest tests/test_license_notices.py -q
      - name: Exercise independent editorial choices and private input refusals
        run: |
          python -m pytest tests/test_newsroom.py tests/test_editorial_cli.py -q
          python scripts/verify-editorial-cli.py --output output/verification/editorial-cli.json
      - name: Check selected public asset notices without granting clearance
        run: |
          python scripts/verify-asset-notices.py
          python -m pytest tests/test_asset_notices.py -q
      - name: Validate bound inventories with the pinned official SPDX schema
        run: python scripts/verify-runtime-sbom-standard.py
      - name: Refuse corrupted SPDX inventories and altered schema trust inputs
        run: python -m pytest tests/test_spdx_inventory.py -q
      - name: Verify optional local-model pins and failure controls without downloading weights
        run: |
          python scripts/verify-nli-profile.py
          python -m pytest tests/test_nli_pairs.py tests/test_nli_network.py tests/test_nli_cli.py tests/test_nli_references.py tests/test_nli_reference_cli.py tests/test_captured_corpus.py -q
      - name: Verify selective reference revision without a truth or freshness verdict
        run: |
          python -m pytest tests/test_reference_revision.py tests/test_corpus_support.py tests/test_nli_references.py -q
          python scripts/verify-reference-revision.py --output output/verification/reference-revisions.json
      - name: Enforce caller-declared reference windows without a freshness or tag claim
        run: |
          python -m pytest tests/test_reference_review_window.py -q
          python scripts/verify-reference-review-windows.py --output output/verification/reference-windows.json
      - name: Exercise private synthetic feedback analysis without collecting participant data
        run: |
          python -m pytest tests/test_feedback_analysis.py tests/test_research_admission.py -q
          python scripts/verify-feedback-analysis.py --output output/verification/feedback-analysis.json
      - name: Refuse research collection and bound synthetic transport independently of tag routes
        run: python -m pytest tests/test_research_http.py tests/test_worker_process.py -q
      - name: Execute parsed feedback and research CI commands to detect folded arguments
        run: python -m pytest tests/test_research_http_workflow.py -q
      - name: Compare private selected revisions without an origin or knowledge verdict
        run: |
          python -m pytest tests/test_session_revisions.py tests/test_revision_public_links.py -q
          python scripts/verify-session-revisions.py --output output/verification/session-revisions.json
      - name: Bind the complete organization audit workflow to actual Linux execution
        run: |
          python scripts/verify-organization-audit-evidence.py
          python -m pytest tests/test_organization_audit.py -q
      - name: Refuse unsafe synthetic backup execution before database creation
        run: python -m pytest tests/test_backup_retention.py tests/test_restore_isolation.py -q
      - name: Check distinct caller-bound choice framing without a manipulation verdict
        run: python -m pytest tests/test_choice_framing.py tests/test_choice_framing_cli.py -q
      - name: Refuse altered source snapshots and unsafe signing policy
        run: python -m pytest tests/test_source_provenance.py -q
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '24' }
      - name: Exercise real build-phase children and refuse partial success
        run: node --test tests/website-build-phases.cjs
      - name: Exercise inactive stream boundaries without capture permissions
        run: node --test tests/stream-observer.cjs
      - name: Verify real public timestamp evidence and refuse tampering without network
        run: python -m pytest tests/test_independent_timestamp.py -q
      - run: python -m pytest tests/test_assertion_formats.py tests/test_http_privacy.py -q

  no-egress:
    # The pipeline must work with the network unplugged. If a component needs the
    # internet to evaluate text, this job fails and that is the intended behaviour.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r services/gateway/requirements.lock
      - run: pip install --require-hashes -r eval/requirements.lock
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      # Source-bound browser/deploy controls need prepared device assets and a
      # normal-owner Git checkout. The site job below runs that complete file.
      - run: sudo unshare -n sh -c 'ip link set lo up && exec "$@"' sh "$(which python)" -m pytest tests --ignore=tests/test_route_boundaries.py -q
      - run: echo "network-isolated evaluator tests complete"

  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r services/gateway/requirements.lock
      - run: pip install --require-hashes -r eval/requirements.lock
      - run: python scripts/verify-dataset-provenance.py --verify-history
      - run: python scripts/verify-regressions.py --output output/verification/hosted-regressions.json
      - run: python scripts/verify-measurements.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: development-regressions
          path: output/verification/hosted-regressions.json
          if-no-files-found: error

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r services/gateway/requirements.lock
      - run: pip install --require-hashes -r eval/requirements.lock
      - name: Require actual accessibility release evidence
        run: python scripts/verify-accessibility-release.py
      - name: Assess statistical evidence even when accessibility refuses release
        if: always()
        run: python eval/harness.py --gates eval/gates.yaml --fixtures eval/datasets/unsafe_code/ps_v1.jsonl --output eval/report.json

  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:axe-gate
      - run: npm run verify:a11y-probes
      - run: npm run verify:consumer
      - run: npm run verify:extension-privacy

  device-builder:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: python3 scripts/verify-device-build-matrix.py

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r services/gateway/requirements.lock
      - run: pip install --require-hashes -r eval/requirements.lock
      - run: npm ci
      - run: npm ci --prefix site
      - name: Validate source-bound redaction development charts and isolated tag states
        run: node --test tests/redaction-performance.cjs tests/blind-review-files.cjs
      - run: npm run verify:enterprise
      - run: npm run build:site
      - name: Bind prepared runtime bytes to retained upstream members
        run: python scripts/verify-asset-notices.py --prepared-runtime
      - name: Exercise native engine resources, freshness and private-output refusals
        run: python -m pytest tests/test_native_bundle.py -q
      - name: Exercise current-route deployment boundaries and violating profiles
        run: python -m pytest tests/test_route_boundaries.py -q
      - run: npx playwright install --with-deps chromium webkit
      - name: Review actual detailed browser export without disabling personal checking
        run: node scripts/verify-editorial-workflow.cjs
      - name: Reproduce the current synthetic service record through the browser export
        run: node scripts/verify-replay-export.cjs --python python
      - name: Offline observations and optional receipt controls
        run: |
          node --test tests/composition-observations.cjs tests/offline-receipts.cjs
          node scripts/verify-composition-tool.cjs
          python scripts/verify-tag-development.py
      - name: Device method parity, offline and private input boundaries
        run: npm run verify:device
      - name: Verify built catalogue and accessibility
        run: |
          python3 -m http.server 5174 --bind 127.0.0.1 --directory site/dist > /tmp/site-server.log 2>&1 &
          site_server_pid=$!
          trap 'kill "$site_server_pid"' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:5174/ > /dev/null; then break; fi
            sleep 1
          done
          npm run verify:site
          npm run verify:performance
          npm run verify:approachability
          npm run verify:ps-results
          npm run verify:site-a11y
          npm run verify:workflows
          npm run verify:policies
          node scripts/verify-blind-review-browser.cjs

  source-provenance:
    # Development-source provenance only. Independent tag-release gates stay separate.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'knwvmbrr/aitrust-id'
    needs: [change-records, host-config, scope-plan, spec, no-egress, regressions, accessibility, device-builder, site]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - name: Build committed development source snapshot
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: python3 scripts/build-source-snapshot.py --commit "$SOURCE_COMMIT" --output output/provenance/aitrust-id-source.tar.gz
      - name: Attest exact source bytes
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: output/provenance/aitrust-id-source.tar.gz
      - name: Preserve verification bundle
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: cp -- "$BUNDLE_PATH" output/provenance/source.sigstore.json
      - name: Preserve independently obtained verification roots
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation trusted-root > output/provenance/trusted-root.jsonl
      - name: Verify the actual signed source before offering the download
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify-source-provenance.py output/provenance/aitrust-id-source.tar.gz --bundle output/provenance/source.sigstore.json --trusted-root output/provenance/trusted-root.jsonl --commit "$SOURCE_COMMIT" --output output/provenance/verification.json
      - name: Downloadable development source and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: authenticated-development-source
          path: output/provenance/
          if-no-files-found: error
          retention-days: 30
