name: ai-tag-tools
on:
  schedule:
    - cron: '40 7 * * *'
  pull_request:
    paths:
      - 'tools/tag_api.py'
      - 'tools/remote_tag_server.py'
      - 'scripts/*ai-tools*'
      - 'scripts/remote-tag-server.py'
      - 'scripts/verify-remote-tag-server.py'
      - 'scripts/verify-remote-openapi.py'
      - 'scripts/tag-api.py'
      - 'scripts/check-tags.py'
      - 'scripts/check-ps.py'
      - 'scripts/aitrust.py'
      - 'scripts/worker_process.py'
      - 'services/evaluator/app.py'
      - 'integrations/**'
      - 'tests/test_ai_*.py'
      - 'tests/test_remote_tag_server.py'
      - 'tests/test_remote_openapi.py'
      - 'deploy/ai-tools/**'
      - '.github/workflows/ai-tools.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  agent-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r integrations/mcp/requirements.lock
      - run: mkdir -p output/verification
      - run: python scripts/verify-ai-tools.py --output output/verification/ai-tools-linux.json
      - run: python -B scripts/verify-remote-openapi.py
      - run: python -B -m unittest discover -s tests -p test_remote_openapi.py -v
      - run: python -B scripts/verify-remote-tag-server.py --output output/verification/remote-tag-server-linux.json
      - uses: actions/upload-artifact@v4
        with:
          name: ai-tools-linux-software-proof
          path: |
            output/verification/ai-tools-linux.json
            output/verification/remote-tag-server-linux.json
          retention-days: 7
          if-no-files-found: error
