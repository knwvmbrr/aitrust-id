name: ai-tag-tools
on:
  schedule:
    - cron: '40 7 * * *'
  pull_request:
    paths:
      - 'tools/tag_api.py'
      - 'scripts/*ai-tools*'
      - 'scripts/tag-api.py'
      - 'scripts/check-tags.py'
      - 'scripts/check-ps.py'
      - 'scripts/aitrust.py'
      - 'scripts/worker_process.py'
      - 'services/evaluator/app.py'
      - 'integrations/**'
      - 'tests/test_ai_*.py'
      - '.github/workflows/ai-tools.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  agent-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r integrations/mcp/requirements.lock
      - run: python scripts/verify-ai-tools.py --output output/verification/ai-tools-linux.json
      - uses: actions/upload-artifact@v4
        with:
          name: ai-tools-linux-software-proof
          path: output/verification/ai-tools-linux.json
          retention-days: 7
          if-no-files-found: error
