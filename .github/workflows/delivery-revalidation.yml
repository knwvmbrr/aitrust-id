name: Source-bound delivery evidence

on:
  pull_request:
    paths:
      - '.github/workflows/delivery-revalidation.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/delivery-revalidation.yml'

permissions:
  contents: read

jobs:
  current-delivery:
    if: github.repository == 'knwvmbrr/aitrust-id' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      AITRUST_VERIFY_PYTHON: python3
      AITRUST_NF_ENGINE_CONCURRENCY: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Initialize unavailable reports for this checkout
        run: |
          python3 - <<'PY'
          import json, pathlib
          from protocol.reports import write_report
          for name in ('PS','PII_REDACTED','extension','protocol','website'):
              write_report('output/delivery/'+name+'.json', {
                  'profile':'delivery-not-started/v1', 'capability':name,
                  'pass':False, 'release_approved':False,
                  'independent_accuracy_evidence':False})
          PY
      - name: Require the runner's existing Java compiler for actual Share controls
        timeout-minutes: 1
        shell: bash
        run: |
          delivery_jdk=''
          for candidate in "${JAVA_HOME:-}" "${JAVA_HOME_17_X64:-}" "${JAVA_HOME_21_X64:-}"; do
            if [ -n "$candidate" ] && [ -x "$candidate/bin/java" ] && [ -x "$candidate/bin/javac" ]; then
              delivery_jdk="$candidate"
              break
            fi
          done
          if [ -z "$delivery_jdk" ]; then
            printf '%s\n' 'Unavailable: the existing runner Java compiler is required.' >&2
            exit 1
          fi
          case "$delivery_jdk" in *$'\n'*|*$'\r'*) exit 1 ;; esac
          "$delivery_jdk/bin/java" -version
          "$delivery_jdk/bin/javac" -version
          printf 'JAVA_HOME=%s\n' "$delivery_jdk" >> "$GITHUB_ENV"
          printf '%s/bin\n' "$delivery_jdk" >> "$GITHUB_PATH"
      - name: Install existing hash-locked dependencies
        timeout-minutes: 5
        run: |
          python3 -m pip install --require-hashes -r services/gateway/requirements.lock
          python3 -m pip install --require-hashes -r eval/requirements.lock
          npm ci
          npm ci --prefix site
      - name: Prepare signed canonical Ubuntu browser dependencies
        timeout-minutes: 1
        env:
          AITRUST_CI_RUNNER_ENV: ${{ runner.environment }}
          AITRUST_CI_RUNNER_OS: ${{ runner.os }}
        run: |
          delivery_apt_dir="$(mktemp -d "$RUNNER_TEMP/aitrust-delivery-apt.XXXXXXXX")"
          AITRUST_CI_SOURCE_DIR="$delivery_apt_dir" python3 scripts/ci-ubuntu-mirror.py --output "$delivery_apt_dir/aitrust-ubuntu.sources"
          sudo install -o root -g root -m 0644 -- "$delivery_apt_dir/aitrust-ubuntu.sources" /etc/apt/sources.list.d/ubuntu.sources
      - name: Install existing locked browser engines
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium webkit
      - name: Execute current PS privacy and extension capabilities
        timeout-minutes: 10
        env:
          AITRUST_CI_RUNNER_ENV: ${{ runner.environment }}
          AITRUST_CI_RUNNER_OS: ${{ runner.os }}
        run: |
          python3 scripts/revalidate.py PS --output output/delivery/PS.json
          python3 scripts/revalidate.py PII_REDACTED --output output/delivery/PII_REDACTED.json
          python3 scripts/revalidate.py extension --output output/delivery/extension.json
      - name: Execute the complete current protocol capability
        timeout-minutes: 12
        env:
          AITRUST_CI_RUNNER_ENV: ${{ runner.environment }}
          AITRUST_CI_RUNNER_OS: ${{ runner.os }}
        run: python3 scripts/revalidate.py protocol --output output/delivery/protocol.json
      - name: Execute the complete current website capability
        timeout-minutes: 25
        env:
          AITRUST_CI_RUNNER_ENV: ${{ runner.environment }}
          AITRUST_CI_RUNNER_OS: ${{ runner.os }}
        run: python3 scripts/revalidate.py website --output output/delivery/website.json
      - name: Assess all five exact receipts
        timeout-minutes: 1
        run: |
          python3 scripts/revalidate.py PS --receipt output/delivery/PS.json
          python3 scripts/revalidate.py PII_REDACTED --receipt output/delivery/PII_REDACTED.json
          python3 scripts/revalidate.py extension --receipt output/delivery/extension.json
          python3 scripts/revalidate.py protocol --receipt output/delivery/protocol.json
          python3 scripts/revalidate.py website --receipt output/delivery/website.json
      - name: Bound the five report files before export
        id: bound_reports
        if: always()
        run: |
          python3 - <<'PYTHON'
          from protocol.evidence import read_evidence
          for name in ('PS','PII_REDACTED','extension','protocol','website'):
              read_evidence('output/delivery/'+name+'.json')
          PYTHON
      - name: Retain only the five bounded JSON receipts
        if: ${{ always() && steps.bound_reports.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-delivery-evidence-${{ github.run_attempt }}
          path: |
            output/delivery/PS.json
            output/delivery/PII_REDACTED.json
            output/delivery/extension.json
            output/delivery/protocol.json
            output/delivery/website.json
          if-no-files-found: error
          retention-days: 7
