<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>AI Trust ID settings</title><style>body{font:16px/1.5 system-ui;max-width:38rem;margin:3rem auto;padding:1rem}input{display:block;width:100%;box-sizing:border-box;font:inherit;padding:.6rem}button{font:inherit;padding:.6rem;margin-top:1rem}button:focus-visible,input:focus-visible{outline:3px solid;outline-offset:3px}</style></head><body><main><h1>Local connection</h1><p>Enter the token configured for your local gateway. It is stored on this browser profile, without synchronization.</p><form><label for="token">Local gateway token</label><input id="token" type="password" autocomplete="off" required minlength="16" aria-describedby="help"><p id="help">Use a generated secret of at least 16 characters. Do not use “change-me”.</p><button type="submit">Save token</button><button type="button" id="clear">Remove token</button></form><p id="status" role="status" aria-live="polite"></p></main><script src="options.js"></script></body></html>
