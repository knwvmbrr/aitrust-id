<script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"WebSite","@id":"https://aitrustid.com/#website","url":"https://aitrustid.com/","name":"AI Trust ID","description":"Explore explainable tags and evidence for AI output. Try the free, open-source command-risk checker on your phone or computer. Each tag has its own validation gate before release.","inLanguage":"en"},{"@type":"CollectionPage","@id":"https://aitrustid.com/#page","url":"https://aitrustid.com/","name":"AI Trust ID — Explainable Tags and Evidence","description":"Explore explainable tags and evidence for AI output. Try the free, open-source command-risk checker on your phone or computer. Each tag has its own validation gate before release.","inLanguage":"en","isPartOf":{"@id":"https://aitrustid.com/#website"}}]}</script><link rel="icon" type="image/svg+xml" href="/favicon.svg"/><script src="/theme.js"></script><link rel="stylesheet" href="/src/styles.css"/></head><body><!-- NOJS START --><noscript><main class="mx-auto max-w-5xl p-6"><h1 class="my-8 break-words text-center text-3xl font-semibold sm:text-4xl">AI TRUST ID</h1><nav class="mb-10 flex justify-center gap-8"><a class="underline" href="#person">Person</a><a class="underline" href="#enterprise">Enterprise</a></nav><section id="person" aria-label="Person tags" class="nojs-tags tag-grid grid gap-4"><details class="rounded-xl border border-line bg-surface p-4"><summary class="cursor-pointer"><span class="block font-sans text-2xl font-semibold">PS</span></summary><div class="mt-4"><h2 class="mb-2 text-xl font-bold">Command risk</h2><p class="mb-4">Building Now</p><p data-tag-availability class="mb-3 text-sm font-semibold">Works here: PS command-pattern preview.</p><p data-tag-summary>Pause before running a command that downloads and runs code.</p><p data-tag-example class="mt-2"><strong>For example:</strong> An AI answer gives you an install command. PS points out supported download-and-run patterns before you use it.</p><p class="mt-2 text-sm text-muted">A warning is about the command, not proof of a scam. No warning does not mean it is safe.</p><section data-tag-usage><h2>Use this tag</h2><p>Copy an AI answer, paste it and check. No account or install needed. Commands are checked, never run.</p><p class="mt-2"><a href="/#person/PS">Check on this device</a></p><p>Open aitrustid.com/#person/PS and choose Check on this device. Optional: save the public app for offline use and add it to your home screen. No answer is uploaded; the phone preview performs no redaction.</p><h3 class="mt-3 font-semibold">Developer local service (optional)</h3><p class="mt-2 text-sm text-muted">Developer preview: Linux or macOS, Python 3.12+, Git, make, and Docker Engine with Compose. First setup downloads packages and models. A one-click installer and a Chrome Web Store release are not available yet.</p><p class="mt-3"><a href="https://github.com/knwvmbrr/aitrust-id/archive/refs/heads/main.zip">Download source</a> · <a href="https://github.com/knwvmbrr/aitrust-id/blob/main/docs/open-validation-path.md">Full setup guide</a></p><ol class="mt-3 list-decimal space-y-3 pl-5"><li><h3 class="font-semibold">Get the source</h3><p>Download the ZIP and read its README, or use Git:</p><pre class="my-2 overflow-x-auto rounded-lg border border-line bg-canvas p-3 text-sm"><code>git clone https://github.com/knwvmbrr/aitrust-id.git
cd aitrust-id</code></pre></li><li><h3 class="font-semibold">Prepare the checker</h3><p>From the repository folder, install its checker dependencies:</p><pre class="my-2 overflow-x-auto rounded-lg border border-line bg-canvas p-3 text-sm"><code>python3 -m venv .venv
.venv/bin/python -m pip install -r eval/requirements.txt
python3 scripts/aitrust.py init</code></pre></li><li><h3 class="font-semibold">Start your local services</h3><p>With Docker Engine and Compose running, build and start only AI Trust ID:</p><pre class="my-2 overflow-x-auto rounded-lg border border-line bg-canvas p-3 text-sm"><code>make deploy ENV_FILE=&quot;$HOME/.config/aitrust-id/runtime.env&quot;
.venv/bin/python scripts/aitrust.py doctor</code></pre></li><li><h3 class="font-semibold">Check an answer</h3><p>Save the answer as response.txt in this folder, then run:</p><pre class="my-2 overflow-x-auto rounded-lg border border-line bg-canvas p-3 text-sm"><code>.venv/bin/python scripts/aitrust.py check response.txt</code></pre></li></ol><p class="mt-3">A PS finding asks you to review a command pattern. No finding means no supported pattern was found, not “safe.” If a check cannot finish, it says so.</p><p class="mt-3">Optional Chrome tags: open chrome://extensions, enable Developer mode, choose Load unpacked, select this repository’s extension folder, then enter your local token in its options. Keep the services running and open ChatGPT. Tags appear below supported answers; click a tag for a short explanation.</p><p class="mt-3">Your answer goes to your own local service, not this website or a training database. Keep your token private. Do not paste it into a public report.</p><h3 class="mt-3 font-semibold">Stop the checker</h3><pre class="my-2 overflow-x-auto rounded-lg border border-line bg-canvas p-3 text-sm"><code>make down ENV_FILE=&quot;$HOME/.config/aitrust-id/runtime.env&quot;</code></pre></section><section data-tag-performance="PS" aria-label="Tag performance" class="my-4 rounded-xl border border-line p-4"><div class="flex flex-wrap justify-between gap-2"><h2 class="text-sm font-semibold">Performance</h2><span class="text-xs text-muted">Working preview</span></div><p class="mt-1 text-sm">Development examples · not an independent accuracy study</p><div class="performance-row"><div class="flex flex-wrap justify-between gap-2"><h3 class="text-sm font-semibold">Correct alerts</h3><span class="tabular-nums text-sm">100.0% · 31/31</span></div><div class="performance-track" aria-hidden="true"><span class="performance-range" style="left:88.97446045395641%;width:11.025539546043595%"></span><span class="performance-target" style="left:93%"></span></div><p class="text-xs text-muted">95% range 89.0%–100.0% · candidate lower bound 93.0%</p><p class="text-xs text-muted">How many flagged examples were correctly flagged.</p></div><div class="performance-row"><div class="flex flex-wrap justify-between gap-2"><h3 class="text-sm font-semibold">Patterns caught</h3><span class="tabular-nums text-sm">100.0% · 31/31</span></div><div class="performance-track" aria-hidden="true"><span class="performance-range" style="left:88.97446045395641%;width:11.025539546043595%"></span><span class="performance-target" style="left:75%"></span></div><p class="text-xs text-muted">95% range 89.0%–100.0% · candidate lower bound 75.0%</p><p class="text-xs text-muted">How many labeled risk examples were found.</p></div><dl class="mt-3 grid grid-cols-2 gap-2 text-xs tabular-nums"><div><dt class="text-muted">Correct alerts</dt><dd class="font-semibold">31</dd></div><div><dt class="text-muted">False alerts</dt><dd class="font-semibold">0</dd></div><div><dt class="text-muted">Missed patterns</dt><dd class="font-semibold">0</dd></div><div><dt class="text-muted">Correctly unflagged</dt><dd class="font-semibold">55</dd></div></dl><p class="mt-2 text-xs text-muted">86 development examples. Range shows sampling uncertainty; tuned examples do not establish real-world accuracy. Independent release validation: pending.</p><p class="mt-1 text-xs text-muted">Measured 2026-10-09</p><p class="mt-2 text-xs"><strong>Next test:</strong> A new frozen, independently labeled set, followed by release acceptance.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Job</h3><p>Find supported network-to-shell and encoded-payload execution patterns in an identified response.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Outcome</h3><p>Read the matched pattern and its limits before acting.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Claim</h3><p>A supported command-risk pattern was found. The adopted PS name previously overclaimed scam detection; this preview uses a bounded explanation.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Method</h3><p>Local lexical matching. Pipe and substitution methods check stdout routing and the execution layer; supported comments, immediate warnings and literal display forms are excluded. No payload is fetched or executed. The evaluator source hash identifies the exact method.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Input</h3><p>Text, currently through the Chrome/ChatGPT development adapter and authenticated local gateway.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Output</h3><p>A versioned tag record with subject binding, method, evidence, limitations, and a result state.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Supported scope</h3><ul class="list-disc pl-5"><li>curl or wget piped to sh or bash, with optional sudo</li><li>Bounded curl/wget stdout command, process and backtick substitution into supported execution commands</li><li>eval/exec receiving base64.b64decode, atob, or bytes.fromhex</li><li>Exact spans in normalized redactor output</li></ul></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Limits</h3><ul class="list-disc pl-5"><li>Does not identify a scam, malicious intent, or human/AI authorship</li><li>Does not execute commands or parse every shell/language form</li><li>Some quotations and mixed contexts may still trigger</li><li>No finding is not a safety clearance; one live Homebrew response verified, broader live-site coverage remains open</li></ul></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Validation</h3><p>Current context-v5 development regression: 86 cases across five active sets, TP 31 / FP 0 / FN 0 / TN 55. These were used during development, not an independent holdout. Development Wilson 95% lower bounds are 0.890 for precision and recall; the candidate precision gate fails. Independent labels and calibration are missing. Earlier live and container evidence covers context-v4; this update has executed HTTP and routing checks, but its full local container/browser pipeline has not been rerun.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Cost</h3><p>Free personal workflow. No paid detector, evidence, or verification gate.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Privacy</h3><p>This catalogue does not evaluate your content. The personal reference implementation uses local services; detected redaction can miss sensitive information.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Dependencies</h3><ul class="list-disc pl-5"><li>Versioned claim and evidence contract</li><li>Independent review for this tag</li><li>Accessible presentation and a clear failure state</li><li>Local redaction before evaluation</li><li>Independent use/mention labels</li></ul></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Failure</h3><p>A failed or unsupported check must not become a finding. A problem with this tag must not disable unrelated tags.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Owner</h3><p>Maintainers own implementation; independent reviewers own validation; the product owner accepts release.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Release requirements</h3><p>Candidate lower bounds 0.93 precision / 0.75 recall need accepted sampling and independent labels. Browser, accessibility, security, challenge/correction and latency gates remain open.</p></section><p class="mt-4">T-PS · Not release validated</p><ul class="mt-4 space-y-2"><li><a class="underline" href="/reference/taxonomy.md">taxonomy.md</a></li><li><a class="underline" href="/reference/signals.md">signals.md</a></li><li><a class="underline" href="/reference/PS-01.md">PS-01.md</a></li><li><a class="underline" href="/reference/PS-01-acceptance.md">PS-01-acceptance.md</a></li><li><a class="underline" href="/reference/regression-gates.json">regression-gates.json</a></li><li><a class="underline" href="/reference/live-gap-implementation.json">live-gap-implementation.json</a></li><li><a class="underline" href="/reference/browser-checks.json">browser-checks.json</a></li><li><a class="underline" href="/reference/extension-integration.json">extension-integration.json</a></li><li><a class="underline" href="/reference/ps_v1.jsonl">ps_v1.jsonl</a></li><li><a class="underline" href="/reference/fetch_execute_v1.jsonl">fetch_execute_v1.jsonl</a></li><li><a class="underline" href="/reference/counterexamples_v2.jsonl">counterexamples_v2.jsonl</a></li><li><a class="underline" href="/reference/live_gap_v1.jsonl">live_gap_v1.jsonl</a></li><li><a class="underline" href="/reference/routing_boundaries_v1.jsonl">routing_boundaries_v1.jsonl</a></li><li><a class="underline" href="/reference/ps-routing-regressions.json">ps-routing-regressions.json</a></li><li><a class="underline" href="/reference/ps-routing-gates.json">ps-routing-gates.json</a></li><li><a class="underline" href="/reference/independent-review.md">independent-review.md</a></li></ul></div></details><details class="rounded-xl border border-line bg-surface p-4"><summary class="cursor-pointer"><span class="block font-sans text-2xl font-semibold">PII</span></summary><div class="mt-4"><h2 class="mb-2 text-xl font-bold">Personal information redacted</h2><p class="mb-4">Building Now</p><p data-tag-availability class="mb-3 text-sm font-semibold">Local setup required. PII does not run in this website checker.</p><p data-tag-summary>Keep detected personal details out of the local checker.</p><p data-tag-example class="mt-2"><strong>For example:</strong> An answer includes an email address. The local service can remove detected values before checking the rest of the text.</p><p class="mt-2 text-sm text-muted">Some sensitive details can be missed. This tag does not mean all private information is gone.</p><section data-tag-usage><h2>Use this tag</h2><p>PII runs before PS in the local service. Set it up once and detected personal details are redacted automatically. This is not part of the website’s on-device checker.</p><p class="mt-2 text-sm text-muted">Developer preview: Linux or macOS, Python 3.12+, Git, make, and Docker Engine with Compose. First setup downloads packages and models. A one-click installer and a Chrome Web Store release are not available yet.</p><p class="mt-3"><a href="https://github.com/knwvmbrr/aitrust-id/archive/refs/heads/main.zip">Download source</a> · <a href="https://github.com/knwvmbrr/aitrust-id/blob/main/docs/open-validation-path.md">Full setup guide</a></p><ol class="mt-3 list-decimal space-y-3 pl-5"><li><h3 class="font-semibold">Get the source</h3><p>Download the ZIP and read its README, or use Git:</p><pre class="my-2 overflow-x-auto rounded-lg border border-line bg-canvas p-3 text-sm"><code>git clone https://github.com/knwvmbrr/aitrust-id.git
cd aitrust-id</code></pre></li><li><h3 class="font-semibold">Prepare the checker</h3><p>From the repository folder, install its checker dependencies:</p><pre class="my-2 overflow-x-auto rounded-lg border border-line bg-canvas p-3 text-sm"><code>python3 -m venv .venv

python3 scripts/aitrust.py init</code></pre></li><li><h3 class="font-semibold">Start your local services</h3><p>With Docker Engine and Compose running, build and start only AI Trust ID:</p><pre class="my-2 overflow-x-auto rounded-lg border border-line bg-canvas p-3 text-sm"><code>make deploy ENV_FILE=&quot;$HOME/.config/aitrust-id/runtime.env&quot;
.venv/bin/python scripts/aitrust.py doctor</code></pre></li><li><h3 class="font-semibold">Check an answer</h3><p>Save the answer as response.txt in this folder, then run:</p><pre class="my-2 overflow-x-auto rounded-lg border border-line bg-canvas p-3 text-sm"><code>.venv/bin/python scripts/aitrust.py check response.txt</code></pre></li></ol><p class="mt-3">A PII tag means detected values were redacted. Without a tag, private details may still be present.</p><p class="mt-3">Optional Chrome tags: open chrome://extensions, enable Developer mode, choose Load unpacked, select this repository’s extension folder, then enter your local token in its options. Keep the services running and open ChatGPT. Tags appear below supported answers; click a tag for a short explanation.</p><p class="mt-3">Your answer goes to your own local service, not this website or a training database. Keep your token private. Do not paste it into a public report.</p><h3 class="mt-3 font-semibold">Stop the checker</h3><pre class="my-2 overflow-x-auto rounded-lg border border-line bg-canvas p-3 text-sm"><code>make down ENV_FILE=&quot;$HOME/.config/aitrust-id/runtime.env&quot;</code></pre></section><section data-tag-performance="PII_REDACTED" aria-label="Tag performance" class="my-4 rounded-xl border border-line p-4"><div class="flex flex-wrap justify-between gap-2"><h2 class="text-sm font-semibold">Performance</h2><span class="text-xs text-muted">Working preview</span></div><p class="mt-1 text-sm">Redaction procedure checked; recognition accuracy not measured.</p><p class="mt-2 text-xs text-muted">Independent release validation: pending.</p><p class="mt-2 text-xs"><strong>Next test:</strong> Measure missed and false redactions by entity category; independently review coverage.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Job</h3><p>Redact detected personal information before local evaluation.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Outcome</h3><p>The evaluator receives the redactor output; the record states which entity types were detected.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Claim</h3><p>Detected entity values were redacted. Some categories, such as URLs, can contain public information. This does not certify that all sensitive information is gone.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Method</h3><p>Local Presidio recognition with a build-provisioned English model and offline email-domain validation.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Input</h3><p>Original text received by the local gateway.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Output</h3><p>Redactor output to the evaluator; entity type/count metadata in the assertion, without the original private values.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Supported scope</h3><ul class="list-disc pl-5"><li>Email recognition exercised against the real service</li><li>Detected redaction precedes evaluation</li><li>Offline suffix data; no runtime model download</li></ul></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Limits</h3><ul class="list-disc pl-5"><li>Personal or sensitive information can remain undetected</li><li>English assets are the current development target</li><li>Neither original nor redacted content should be submitted to a public report</li></ul></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Validation</h3><p>Real email redaction, pipeline ordering, source hashes, and synthetic log markers checked. Independent coverage and accuracy measurements are missing.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Cost</h3><p>Free personal workflow. No paid detector, evidence, or verification gate.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Privacy</h3><p>This catalogue does not evaluate your content. The personal reference implementation uses local services; detected redaction can miss sensitive information.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Dependencies</h3><ul class="list-disc pl-5"><li>Versioned claim and evidence contract</li><li>Independent review for this tag</li><li>Accessible presentation and a clear failure state</li></ul></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Failure</h3><p>A required redaction failure stops evaluation. It must not bypass redaction to obtain a tag.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Owner</h3><p>Maintainers own implementation; independent reviewers own validation; the product owner accepts release.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Release requirements</h3><p>Publish agreed acceptance criteria, run independent validation, and verify the complete user workflow before release.</p></section><p class="mt-4">T-PII · Not release validated</p><ul class="mt-4 space-y-2"><li><a class="underline" href="/reference/taxonomy.md">taxonomy.md</a></li><li><a class="underline" href="/reference/signals.md">signals.md</a></li><li><a class="underline" href="/reference/container-checks.json">container-checks.json</a></li></ul></div></details><details class="rounded-xl border border-line bg-surface p-4"><summary class="cursor-pointer"><span class="block font-sans text-2xl font-semibold">NF</span></summary><div class="mt-4"><h2 class="mb-2 text-xl font-bold">Non-Fiction</h2><p class="mb-4">Coming Soon</p><p data-tag-availability class="mb-3 text-sm font-semibold">Not available yet. This tag is planned or proposed.</p><p data-tag-summary>See how an answer lines up with the references you choose.</p><p data-tag-example class="mt-2"><strong>For example:</ lanned. Managing devices must not weaken a tag’s evidence standard.</p><section data-tag-usage><h2>Use this tag</h2><p>Coming Soon. This team offering is still being designed; there is no paid service to sign up for yet.</p><p data-tag-today class="mt-3">You can review the extension’s access to chatgpt.com and your local gateway (127.0.0.1:8787) in the public source. Team rollout is still planned.</p></section><section data-tag-performance="fleet" aria-label="Tag performance" class="my-4 rounded-xl border border-line p-4"><div class="flex flex-wrap justify-between gap-2"><h2 class="text-sm font-semibold">Performance</h2><span class="text-xs text-muted">Not running</span></div><p class="mt-1 text-sm">Organization capability; performance not measured.</p><p class="mt-2 text-xs text-muted">Independent release validation: pending.</p><p class="mt-2 text-xs"><strong>Next test:</strong> Test deployment, version rollback and per-tag policy isolation.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Job</h3><p>Deploy and manage tag tools across an organization.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Outcome</h3><p>Apply deployment policy without changing what a tag is allowed to claim.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Claim</h3><p>A deployment and policy capability. It changes who runs a tag and where, never what a tag asserts or how confident it is.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Method</h3><p>Planned managed configuration layered over the existing extension and local checker. No server-side evaluation, and no policy hook that can alter a tag threshold or claim.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Input</h3><p>Organization deployment policy and the existing extension/local-checker configuration.</p></section><section class="border-t border-line py-4" ss="list-disc pl-5"><li>Available now — the intended capture boundary is written down and reviewable before anyone pilots anything</li><li>Planned — enumerated path allowlist with no directory traversal</li><li>Planned — per-session consent with a visible indicator while capture is active</li><li>Planned — capture scope recorded inside every record the agent produces</li></ul></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Limits</h3><ul class="list-disc pl-5"><li>No host agent or tested consent flow exists yet</li><li>Requires consent, least privilege and an independently reviewed capture boundary</li><li>Access must be limited to explicitly supported artifacts; wider access adds privacy exposure</li><li>Underlying personal detection and evidence remain free</li></ul></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Validation</h3><p>No host implementation has been tested. Capture boundaries, consent and security review are required before a pilot.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Cost</h3><p>Proposed paid organization offering. Pricing is not set, there is no checkout, and no subscription or contract is available. The personal detection, evidence and verification capabilities stay free and open.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Privacy</h3><p>An agent may access only the agreed artifacts. N-004 covers consent, pause, reset and deletion; F-087 requires clear capture boundaries. No host agent is collecting files today.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Dependencies</h3><ul class="list-disc pl-5"><li>Reviewed capture boundary (WP-CAPTURE)</li><li>Accepted privacy terms (WP-PRIVACY)</li><li>Accepted release process (WP-RELEASE)</li></ul></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Failure</h3><p>A failed or unsupported organization capability must not become a finding, and must not disable the personal workflow or any unrelated tag.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Owner</h3><p>Maintainers own implementation; independent reviewers own validation; the product owner accepts release and any organization commitment.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Release requirements</h3><p>Publish and independently review the capture boundary. Test consent, pause, reset, deletion, allowed paths and denied access before a pilot. The browser adapter is a separate capture route, not proof that a host agent is safe.</p></section><p class="mt-4">F-160 · Not release validated</p><ul class="mt-4 space-y-2"><li><a class="underline" href="/reference/public-scope.json">public-scope.json</a></li></ul></div></details><details class="rounded-xl border border-line bg-surface p-4"><summary class="cursor-pointer"><span class="block font-sans text-2xl font-semibold">AUDIT</span></summary><div class="mt-4"><h2 class="mb-2 text-xl font-bold">Audit tags</h2><p class="mb-4">Coming Soon</p><p data-tag-availability class="mb-3 text-sm font-semibold">Planned offering. No team service is running.</p><p data-tag-summary>Keep a clear history of findings and corrections.</p><p data-tag-example class="mt-2"><strong>For example:</strong> A team follows which method produced a finding and how a later review changed it.</p><p class="mt-2 text-sm text-muted">Planned. Keeping a record does not make its finding more certain.</p><section data-tag-usage><h2>Use this tag</h2><p>Coming Soon. This team offering is still being designed; there is no paid service to sign up for yet.</p><p data-tag-today class="mt-3">Today, you can save the summary from a PS check. Detailed results are optional and include privacy-sensitive fingerprints. Download details here saves this offering’s description, not a checked answer.</p><p class="mt-3"><a href="/#person/PS">Try PS exports</a></p></section><section data-tag-performance="audit" aria-label="Tag performance" class="my-4 rounded-xl border border-line p-4"><div class="flex flex-wrap justify-between gap-2"><h2 class="text-sm font-semibold">Performance</h2><span class="text-xs text-muted">Not running</span></div><p class="mt-1 text-sm">Organization capability; performance not measured.</p><p class="mt-2 text-xs text-muted">Independent release validation: pending.</p><p class="mt-2 text-xs"><strong>Next test:</strong> Test record retention, corrections, authorized access and deletion.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Job</h3><p>Retain versioned tag records for organization audit.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Outcome</h3><p>Trace record versions, review and corrections under a defined retention policy.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Claim</h3><p>A retention and traceability capability. Keeping a record longer does not make the finding in it more certain.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Method</h3><p>Planned organization retention over the existing versioned record contract. The record format is the same one the personal workflow already emits.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Input</h3><p>Tag records the organization already holds, plus an accepted retention period.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Output</h3><p>A version history per record, with review and correction events, under a stated retention and deletion policy.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Supported scope</h3><ul class="list-disc pl-5"><li>Available now — download a summary after an on-device PS check</li><li>Available now — opt in to a detailed PS result with a method hash and evidence positions</li><li>Planned — record history, review and correction events</li><li>Planned — team retention and deletion rules</li></ul></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Limits</h3><ul class="list-disc pl-5"><li>No organization audit store, automatic upload or retention service runs today</li><li>Detailed exports can link or reveal information through subject hashes and evidence positions, even without answer text</li><li>Saving a result does not independently validate the finding</li><li>Underlying personal detection and evidence remain free</li></ul></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Validation</h3><p>PS result exports and catalogue-description exports are separate tested workflows. Team storage, version history and correction events are not implemented.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Cost</h3><p>Proposed paid organization offering. Pricing is not set, there is no checkout, and no subscription or contract is available. The personal detection, evidence and verification capabilities stay free and open.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Privacy</h3><p>Choose what to keep and who can access it before storage is enabled. F-044 has a hashes-only, 30-day registry scope; that is not an active audit service or a universal retention policy. Detailed PS exports need your separate choice to include fingerprints and positions.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Dependencies</h3><ul class="list-disc pl-5"><li>Operations ownership (WP-OPERATIONS)</li><li>Accepted privacy terms (WP-PRIVACY)</li><li>Record version contract (WP-PROTOCOL)</li></ul></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Failure</h3><p>A failed or unsupported organization capability must not become a finding, and must not disable the personal workflow or any unrelated tag.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Owner</h3><p>Maintainers own implementation; independent reviewers own validation; the product owner accepts release and any organization commitment.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Release requirements</h3><p>Agree approved fields, access, retention and deletion before enabling storage. Implement corrections and supersession (N-005), revalidation (N-006) and versioned signal references (F-003). Test that deletions and access restrictions work.</p></section><p class="mt-4">F-161 · Not release validated</p><ul class="mt-4 space-y-2"><li><a class="underline" href="/reference/public-scope.json">public-scope.json</a></li></ul></div></details><details class="rounded-xl border border-line bg-surface p-4"><summary class="cursor-pointer"><span class="block font-sans text-2xl font-semibold">SSO</span></summary><div class="mt-4"><h2 class="mb-2 text-xl font-bold">Identity-managed tags</h2><p class="mb-4">Coming Soon</p><p data-tag-availability class="mb-3 text-sm font-semibold">Planned offering. No team service is running.</p><p data-tag-summary>Give team members the access they need.</p><p data-tag-example class="mt-2"><strong>For example:</strong> Map directory groups to separate permissions for configuration, viewing, review and export.</p><p class="mt-2 text-sm text-muted">Planned. Signing in does not validate a finding or make author receipts compulsory.</p><section data-tag-usage><h2>Use this tag</h2><p>Coming Soon. This team offering is still being designed; there is no paid service to sign up for yet.</p><p data-tag-today class="mt-3">Review the proposed configure, view, review and export permissions against your team’s groups. These are design choices to discuss, not enforced roles or a working sign-in service.</p></section><section data-tag-performance="sso" aria-label="Tag performance" class="my-4 rounded-xl border border-line p-4"><div class="flex flex-wrap justify-between gap-2"><h2 class="text-sm font-semibold">Performance</h2><span class="text-xs text-muted">Not running</span></div><p class="mt-1 text-sm">Organization capability; performance not measured.</p><p class="mt-2 text-xs text-muted">Independent release validation: pending.</p><p class="mt-2 text-xs"><strong>Next test:</strong> Test access roles, revocation and organization separation.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Job</h3><p>Manage organization access to tag workflows using directory identity.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Outcome</h3><p>Assign least-privilege roles to organization workflows.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Claim</h3><p>An access-control capability. Knowing who is signed in says nothing whatsoever about whether a content claim is true.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Method</h3><p>Proposed directory integration with separate configuration, viewing, review and export permissions. No identity provider is connected today.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Input</h3><p>Organization directory groups and the published role definitions.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Output</h3><p>An authorization decision per workflow, and an access event that is kept separate from any tag record.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Supported scope</h3><ul class="list-disc pl-5"><li>Available now — review the proposed permission split in this catalogue</li><li>Planned — separate policy administration from independent review authority</li><li>Planned — SAML or OIDC group mapping</li><li>Planned — access events kept separate from tag findings</li></ul></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Limits</h3><ul class="list-disc pl-5"><li>Signing in does not prove a finding is correct</li><li>No identity provider or role enforcement has been tested</li><li>An administrator’s permissions must not silently grant independent review status</li><li>Underlying personal detection and evidence remain free</li></ul></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Validation</h3><p>No identity provider has been integrated and no access control has been tested. The role split is a design proposal open to review.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Cost</h3><p>Proposed paid organization offering. Pricing is not set, there is no checkout, and no subscription or contract is available. The personal detection, evidence and verification capabilities stay free and open.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Privacy</h3><p>Directory identity is personal data. Define access-event fields and retention separately from tag findings. Response and revision binding (F-088) must not turn into an unsupported claim about a person’s identity.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Dependencies</h3><ul class="list-disc pl-5"><li>Operations ownership (WP-OPERATIONS)</li><li>Accepted privacy terms (WP-PRIVACY)</li></ul></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Failure</h3><p>A failed or unsupported organization capability must not become a finding, and must not disable the personal workflow or any unrelated tag.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Owner</h3><p>Maintainers own implementation; independent reviewers own validation; the product owner accepts release and any organization commitment.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Release requirements</h3><p>Test least-privilege role mapping, denied access and review independence. Verify that authors can decline receipt issuance (F-128), and review key custody (F-129) and group authorship (F-130) under team identity. Login must not be used to coerce attestation.</p></section><p class="mt-4">F-162 · Not release validated</p><ul class="mt-4 space-y-2"><li><a class="underline" href="/reference/public-scope.json">public-scope.json</a></li></ul></div></details><details class="rounded-xl border border-line bg-surface p-4"><summary class="cursor-pointer"><span class="block font-sans text-2xl font-semibold">SUPPORT</span></summary><div class="mt-4"><h2 class="mb-2 text-xl font-bold">Supported team tags</h2><p class="mb-4">Coming Soon</p><p data-tag-availability class="mb-3 text-sm font-semibold">Planned offering. No team service is running.</p><p data-tag-summary>Get a clear owner for team help and maintenance.</p><p data-tag-example class="mt-2"><strong>For example:</strong> A team knows where to ask for deployment help and who owns the agreed follow-up.</p><p class="mt-2 text-sm text-muted">Planned. Paid support and response-time commitments are not available yet.</p><section data-tag-usage><h2>Use this tag</h2><p>Coming Soon. This team offering is still being designed; there is no paid service to sign up for yet.</p><p data-tag-today class="mt-3">You can report defects for free today. Use the private vulnerability channel for security issues, and public issue reports for non-sensitive defects. Accessibility problems are treated as defects under the published policy; there is no paid support or promised response time yet.</p></section><section data-tag-performance="support" aria-label="Tag performance" class="my-4 rounded-xl border border-line p-4"><div class="flex flex-wrap justify-between gap-2"><h2 class="text-sm font-semibold">Performance</h2><span class="text-xs text-muted">Not running</span></div><p class="mt-1 text-sm">Organization capability; performance not measured.</p><p class="mt-2 text-xs text-muted">Independent release validation: pending.</p><p class="mt-2 text-xs"><strong>Next test:</strong> Validate the actual support workflow before promising response times.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Job</h3><p>Provide contracted deployment and maintenance support.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Outcome</h3><p>Know who owns response and maintenance commitments.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Claim</h3><p>An ownership and response capability. It is a commitment about people and timelines, not about accuracy.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Method</h3><p>Planned contracted support over the existing public channels. No contract, retainer or paid tier exists.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Input</h3><p>An accepted support agreement and a named organization contact.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Output</h3><p>A named owner per issue class and an agreed response commitment.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Supported scope</h3><ul class="list-disc pl-5"><li>Available now — private security disclosure through the repository</li><li>Available now — accessibility defect reporting under the published policy</li><li>Planned — a named owner for each support responsibility</li><li>Planned — agreed response commitments under a support contract</li></ul></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Limits</h3><ul class="list-disc pl-5"><li>No support contract or response-time promise is offered today</li><li>Support cannot substitute for independent tag validation</li><li>Staffing and escalation need to be verified before promising coverage</li><li>Underlying personal detection and evidence remain free</li></ul></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Validation</h3><p>No support contract has been offered, priced or honoured. The disclosure channels above are live and documented.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Cost</h3><p>Proposed paid organization offering. Pricing is not set, there is no checkout, and no subscription or contract is available. The personal detection, evidence and verification capabilities stay free and open.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Privacy</h3><p>An issue report can contain the content someone was checking, which is why neither original nor redacted content should be attached to a public report. Support correspondence is not a content store and must not become one.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Dependencies</h3><ul class="list-disc pl-5"><li>Operations ownership (WP-OPERATIONS)</li><li>Published site and contact surface (WP-SITE)</li></ul></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Failure</h3><p>A failed or unsupported organization capability must not become a finding, and must not disable the personal workflow or any unrelated tag.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Owner</h3><p>Maintainers own implementation; independent reviewers own validation; the product owner accepts release and any organization commitment.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Release requirements</h3><p>Name support owners and escalation routes, verify coverage, and test the commitments before offering a contract. Check failure handling (F-096) so a service problem cannot turn into a misleading finding.</p></section><p class="mt-4">F-163 · ine py-4"><h3 class="mb-2 font-bold">Job</h3><p>Define organization-specific tag workflows and policy extensions.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Outcome</h3><p>Apply a private policy with clear provenance and claim boundaries.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Claim</h3><p>A private extension capability, bounded so that a private policy can add obligations but never weaken a public claim.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Method</h3><p>Planned private policy layer with a published list of what a private policy may and may not do. Not built.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Input</h3><p>An organization policy document and the public standard it extends.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Output</h3><p>A private policy identifier recorded on affected records, so a reader can tell which policy produced a result.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Supported scope</h3><ul class="list-disc pl-5"><li>Available now — review the proposed private-policy boundaries in this catalogue</li><li>Available now — offering names are distinguished from adopted standard codes</li><li>Planned — identify the private policy on each affected record</li><li>Planned — test that private rules do not weaken public claims</li></ul></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Limits</h3><ul class="list-disc pl-5"><li>Display names here are offering names, not adopted standard codes</li><li>A private policy must not dilute or misrepresent the public standard, and must never reuse a public tag code for a different claim</li><li>A private extension is not a private fork of the evidence standard; thresholds move one way only, upward</li><li>Underlying personal detection and evidence remain free</li></ul></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Validation</h3><p>The boundaries are a reviewable design, not an adopted conformance program. No private policy engine or enforcement tests exist yet.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Cost</h3><p>Proposed paid organization offering. Pricing is not set, there is no checkout, and no subscription or contract is available. The personal detection, evidence and verification capabilities stay free and open.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Privacy</h3><p>A private policy must preserve consent and the public privacy commitments. Team payment does not waive no-telemetry (F-086) or capture boundaries (F-087) for the people whose content is checked.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Dependencies</h3><ul class="list-disc pl-5"><li>Accepted privacy terms (WP-PRIVACY)</li><li>Record version contract (WP-PROTOCOL)</li><li>Independent validation (WP-VALIDATION)</li></ul></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Failure</h3><p>A failed or unsupported organization capability must not become a finding, and must not disable the personal workflow or any unrelated tag.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Owner</h3><p>Maintainers own implementation; independent reviewers own validation; the product owner accepts release and any organization commitment.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Release requirements</h3><p>Build the conformance check for the four prohibitions before offering this commercially, so a private policy that lowers a published threshold or reuses a public code fails a test rather than a conversation. WP-VALIDATION gates it: an extension mechanism with no conformance check is an invitation to dilute the standard quietly.</p></section><p class="mt-4">N-010 · Not release validated</p><ul class="mt-4 space-y-2"><li><a class="underline" href="/reference/public-scope.json">public-scope.json</a></li></ul></div></details></section><footer class="mt-12 border-t border-line py-6"><p>AI TRUST ID · Every tag must pass its own published validation gate before release.</p><p class="mt-3">Published by AI Trust ID.</p><p class="mt-4">No automatic report upload or research collection is enabled. Public development discussion is on GitHub.</p><a class="mt-4 block underline" href="/tags/">Tag reference</a><a class="mt-4 block underline" href="/policies/">Public terms and policies</a><a class="mt-4 block underline" href="/reference/public-scope.json">Full preserved scope</a><a class="mt-4 block underline" href="https://github.com/knwvmbrr/aitrust-id/archive/refs/heads/main.zip" rel="noreferrer">Download source</a><a class="mt-4 block underline" href="https://github.com/knwvmbrr/aitrust-id/blob/main/docs/open-validation-path.md" rel="noreferrer">Local setup</a></footer></main></noscript><!-- NOJS END --><div id="root"></div><script type="module" src="/src/main.jsx"></script></body></html>
