<script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"WebSite","@id":"https://aitrustid.com/#website","url":"https://aitrustid.com/","name":"AI Trust ID","description":"Check AI answers for supported command-risk patterns with the free PS preview. Runs on your phone or computer. Explore each tag’s evidence, limits and validation.","inLanguage":"en"},{"@type":"CollectionPage","@id":"https://aitrustid.com/#page","url":"https://aitrustid.com/","name":"AI Trust ID — Free, Open-Source AI Output Checks","description":"Check AI answers for supported command-risk patterns with the free PS preview. Runs on your phone or computer. Explore each tag’s evidence, limits and validation.","inLanguage":"en","isPartOf":{"@id":"https://aitrustid.com/#website"}}]}</script><link rel="icon" type="image/svg+xml" href="/favicon.svg"/><script src="/theme.js"></script><link rel="stylesheet" href="/src/styles.css"/></head><body><!-- NOJS START --><noscript><main class="mx-auto max-w-5xl p-6"><h1 class="my-8 break-words text-center text-3xl font-semibold sm:text-4xl">AI TRUST ID</h1><nav class="mb-10 flex justify-center gap-8"><a class="underline" href="#person">Person</a><a class="underline" href="#enterprise">Enterprise</a></nav><section id="person" aria-label="Person tags" class="nojs-tags tag-grid grid gap-4"><details class="rounded-xl border border-line bg-surface p-4"><summary class="cursor-pointer"><span class="block font-sans text-2xl font-semibold">PS</span></summary><div class="mt-4"><h2 class="mb-2 text-xl font-bold">Command risk</h2><p class="mb-4">Building Now</p><p data-tag-availability class="mb-3 text-left text-xs text-muted">Works here: PS command-pattern preview.</p><p data-tag-summary class="text-left">PS checks for commands that run downloaded or encoded code and explains what it finds.</p><p data-tag-example class="mt-2"><strong>For example:</strong> An AI answer gives you an install command. PS points out supported download-and-run patterns before you use it.</p><p class="mt-2 text-sm text-muted">A warning is about the command, not proof of a scam. No warning does not mean it is safe.</p><section data-tag-usage><h2>Use this tag</h2><p>Copy an AI answer, paste it and check. No account or install needed. Commands are checked, never run.</p><h3 class="mt-3 font-semibold">PS in Terminal</h3><p>Prefer Terminal? Download the small PS-only source ZIP and unzip it. Open its folder, save an answer as response.txt, then run the command below on Linux or macOS with Python 3.12+. No packages, account or local service needed. Up to 20,000 characters. No redaction is performed.</p><p><a href="/downloads/aitrust-id-ps-source.zip" download>Download PS source</a> · <a href="/reference/ps-source-distribution.md">PS download guide</a></p><pre tabindex="0" class="my-2 overflow-x-auto rounded-lg border border-line bg-canvas p-3 text-sm"><code>python3 -I -S -B scripts/check-ps.py response.txt</code></pre><p class="mt-2"><a href="/#person/PS">Check on this device</a></p><p>Open aitrustid.com/#person/PS and choose Check on this device. Optional: save the public app for offline use and add it to your home screen. No answer is uploaded; the phone preview performs no redaction.</p><h3 class="mt-3 font-semibold">Developer local service (optional)</h3><p class="mt-2 text-sm text-muted">Developer preview: Linux, Python 3.12+ and an installed, working Podman engine. First setup downloads pinned dependencies. Read the full guide for private build-network options and the older manual Docker Compose path. This command does not install an engine; no Chrome Web Store release is offered.</p><p class="mt-3"><a href="https://github.com/knwvmbrr/aitrust-id/archive/refs/heads/main.zip">Download source</a> · <a href="https://github.com/knwvmbrr/aitrust-id/blob/main/docs/open-validation-path.md">Full setup guide</a></p><ol class="mt-3 list-decimal space-y-3 pl-5"><li><h3 class="font-semibold">Get the source</h3><p>Download and unzip the source, then open its folder. Or use Git:</p><pre tabindex="0" class="my-2 overflow-x-auto rounded-lg border border-line bg-canvas p-3 text-sm"><code>git clone https://github.com/knwvmbrr/aitrust-id.git
cd aitrust-id</code></pre></li><li><h3 class="font-semibold">Start your own checker</h3><p>On Linux with Python 3.12+ and a working Podman engine, run this from the source folder. It creates a private installation and checks that it works:</p><pre tabindex="0" class="my-2 overflow-x-auto rounded-lg border border-line bg-canvas p-3 text-sm"><code>python3 scripts/setup-local.py --engine podman</code></pre></li><li><h3 class="font-semibold">Check an answer</h3><p>Save an answer as response.txt, then run:</p><pre tabindex="0" class="my-2 overflow-x-auto rounded-lg border border-line bg-canvas p-3 text-sm"><code>LOCAL_STATE=&quot;$HOME/.config/aitrust-id/local-stack&quot;
&quot;$LOCAL_STATE/checker/bin/python&quot; scripts/aitrust.py check response.txt --env-file &quot;$LOCAL_STATE/runtime.env&quot;</code></pre></li></ol><p class="mt-3">A PS finding asks you to review a command pattern. No finding means no supported pattern was found, not “safe.” If a check cannot finish, it says so.</p><p class="mt-3">Optional Chrome tags: follow docs/gateway-authentication.md in the downloaded repository to set up gateway signing. Open chrome://extensions, enable Developer mode, choose Load unpacked and select the extension folder. In its settings, choose your gateway public-key JSON, confirm its fingerprint separately and enter your local token. Turn on Enable checks on ChatGPT when ready. Keep your services running. Tags appear below supported answers; click for a short explanation. Unsigned or altered results stay unavailable. Pause or reset at any time.</p><p class="mt-3">Your answer goes to your own local service, not this website or a training database. Keep your token private. Do not paste it into a public report.</p><p class="mt-3"><a href="https://github.com/knwvmbrr/aitrust-id/blob/main/docs/assertion-replay.md">Repeat a saved local-service check</a>. This compares your saved findings against the same method; it does not send research data to us.</p><h3 class="mt-3 font-semibold">Stop the checker</h3><pre tabindex="0" class="my-2 overflow-x-auto rounded-lg border border-line bg-canvas p-3 text-sm"><code>python3 scripts/setup-local.py --engine podman --stop</code></pre></section><section data-tag-performance="PS" aria-label="Tag performance" class="my-4 rounded-xl border border-line p-4"><div class="flex flex-wrap justify-between gap-2"><h2 class="text-sm font-semibold">Performance</h2><span class="text-xs text-muted">Working preview</span></div><p class="mt-1 text-sm">Development examples · not an independent accuracy study</p><div class="performance-row"><div class="flex flex-wrap justify-between gap-2"><h3 class="text-sm font-semibold">Correct alerts</h3><span class="tabular-nums text-sm">100.0% · 31/31</span></div><div class="performance-track" aria-hidden="true"><span class="performance-range" style="left:88.97446045395641%;width:11.025539546043595%"></span><span class="performance-target" style="left:93%"></span></div><p class="text-xs text-muted">95% range 89.0%–100.0% · candidate lower bound 93.0%</p><p class="text-xs text-muted">How many flagged examples were correctly flagged.</p></div><div class="performance-row"><div class="flex flex-wrap justify-between gap-2"><h3 class="text-sm font-semibold">Patterns caught</h3><span class="tabular-nums text-sm">100.0% · 31/31</span></div><div class="performance-track" aria-hidden="true"><span class="performance-range" style="left:88.97446045395641%;width:11.025539546043595%"></span><span class="performance-target" style="left:75%"></span></div><p class="text-xs text-muted">95% range 89.0%–100.0% · candidate lower bound 75.0%</p><p class="text-xs text-muted">How many labeled risk examples were found.</p></div><dl class="mt-3 grid grid-cols-2 gap-2 text-xs tabular-nums"><div><dt class="text-muted">Correct alerts</dt><dd class="font-semibold">31</dd></div><div><dt class="text-muted">False alerts</dt><dd class="font-semibold">0</dd></div><div><dt class="text-muted">Missed patterns</dt><dd class="font-semibold">0</dd></div><div><dt class="text-muted">Correctly unflagged</dt><dd class="font-semibold">55</dd></div></dl><details class="mt-3"><summary class="min-h-11 cursor-pointer py-3 font-semibold">Test breakdown</summary><p class="mb-2 text-muted">Development input groups, not a representative accuracy study.</p><dl class="space-y-2"><div class="border-b border-line pb-2"><dt class="font-semibold">Encoded content</dt><dd class="tabular-nums">6 examples · 0 false alerts · 0 missed patterns</dd></div><div class="border-b border-line pb-2"><dt class="font-semibold">Downloads saved to files</dt><dd class="tabular-nums">17 examples · 0 false alerts · 0 missed patterns</dd></div><div class="border-b border-line pb-2"><dt class="font-semibold">Ordinary answers</dt><dd class="tabular-nums">5 examples · 0 false alerts · 0 missed patterns</dd></div><div class="border-b border-line pb-2"><dt class="font-semibold">Other code forms</dt><dd class="tabular-nums">5 examples · 0 false alerts · 0 missed patterns</dd></div><div class="border-b border-line pb-2"><dt class="font-semibold">Other download commands</dt><dd class="tabular-nums">42 examples · 0 false alerts · 0 missed patterns</dd></div><div class="border-b border-line pb-2"><dt class="font-semibold">Quoted or discussed downloads</dt><dd class="tabular-nums">11 examples · 0 false alerts · 0 missed patterns</dd></div></dl></details><details data-service-timing class="mt-3"><summary class="min-h-11 cursor-pointer py-3 font-semibold">Local service speed</summary><p class="mb-2 text-muted">Includes redaction and tagging. The phone preview uses a different route.</p><dl class="space-y-2"><div><dt class="text-muted">256 characters</dt><dd class="tabular-nums">57 ms<div class="h-1 rounded-full bg-line" aria-hidden="true"><div class="h-1 rounded-full bg-ink" style="width:3.1611297719302835%"></div></div></dd></div><div><dt class="text-muted">2,000 characters</dt><dd class="tabular-nums">138 ms<div class="h-1 rounded-full bg-line" aria-hidden="true"><div class="h-1 rounded-full bg-ink" style="width:7.683800495020204%"></div></div></dd></div><div><dt class="text-muted">8,000 characters</dt><dd class="tabular-nums">563 ms<div class="h-1 rounded-full bg-line" aria-hidden="true"><div class="h-1 rounded-full bg-ink" style="width:31.3909894567323%"></div></div></dd></div><div><dt class="text-muted">20,000 characters</dt><dd class="tabular-nums">1.79 s<div class="h-1 rounded-full bg-line" aria-hidden="true"><div class="h-1 rounded-full bg-ink" style="width:100%"></div></div></dd></div></dl><p class="mt-2 text-muted">20 repeats per profile on Linux (4 logical CPUs). Bars show the slowest profile’s warm p95, not a speed guarantee.</p><p class="mt-1 text-muted">Measured 2026-11-12 · synthetic inputs</p><a class="inline-block min-h-11 py-3 underline underline-offset-4" href="/reference/pipeline-performance.json" download>Download service timings</a></details><p class="mt-3 text-xs text-muted">Efficiency tests compare warm rule checks and temporary Python allocations on the same computer, not accuracy or whole-service speed. <a class="inline-block min-h-11 py-3 underline underline-offset-4" href="/reference/ps-efficiency.json" download>Download paired efficiency tests</a></p><p class="mt-2 text-xs text-muted">86 development examples. Range shows sampling uncertainty; tuned examples do not establish real-world accuracy. Independent release validation: pending.</p><p class="mt-1 text-xs text-muted">Measured 2026-10-13</p><p class="mt-2 text-xs"><strong>Next test:</strong> A new frozen, independently labeled set, followed by release acceptance.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Job</h3><p>Find supported network-to-shell and encoded-payload execution patterns in an identified response.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Outcome</h3><p>Read the matched pattern and its limits before acting.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Claim</h3><p>A supported command-risk pattern was found. The adopted PS name previously overclaimed scam detection; this preview uses a bounded explanation.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Method</h3><p>Local lexical matching. Pipe and substitution methods check stdout routing and the execution layer; supported comments, immediate warnings and literal display forms are excluded. No payload is fetched or executed. The evaluator source hash identifies the exact method.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Input</h3><p>Text, currently through the Chrome/ChatGPT development adapter and authenticated local gateway.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Output</h3><p>A versioned tag record with subject binding, method, evidence, limitations, and a result state.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Supported scope</h3><ul class="list-disc pl-5"><li>curl or wget piped to sh or bash, with optional sudo</li><li>Bounded curl/wget stdout command, process and backtick substitution into supported execution commands</li><li>eval/exec receiving base64.b64decode, atob, or bytes.fromhex</li><li>Exact spans in normalized redactor output</li></ul></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Limits</h3><ul class="list-disc pl-5"><li>Does not identify a scam, malicious intent, or human/AI authorship</li><li>Does not execute commands or parse every shell/language form</li><li>Quoted or escaped command names and decoder aliases can be missed; eight syntax/token-preserving spelling tests bypassed the current matcher</li><li>No finding is not a safety clearance; one live Homebrew response verified, broader live-site coverage remains open</li></ul></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Validation</h3><p>Current context-v6 development regression: 86 cases across five active sets, TP 31 / FP 0 / FN 0 / TN 55. These were used during development, not an independent holdout. Development Wilson 95% lower bounds are 0.890 for precision and recall; the candidate precision gate fails. Independent labels and calibration are missing. Current context-v6 service staging passed 32 real HTTP checks, including redaction binding, dependency failures and recovery. Eleven additional real HTTP fault checks cover saturation, disconnect and timeout. These are engineering checks; broader live adapter, human usability and independent accuracy gates remain open.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Cost</h3><p>Free personal workflow. No paid detector, evidence, or verification gate.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Privacy</h3><p>This catalogue does not evaluate your content. The personal reference implementation uses local services; detected redaction can miss sensitive information.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Dependencies</h3><ul class="list-disc pl-5"><li>Versioned claim and evidence contract</li><li>Independent review for this tag</li><li>Accessible presentation and a clear failure state</li><li>Local redaction before evaluation</li><li>Independent use/mention labels</li></ul></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Failure</h3><p>A failed or unsupported check must not become a finding. A problem with this tag must not disable unrelated tags.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Owner</h3><p>Maintainers own implementation; independent reviewers own validation; the product owner accepts release.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Release requirements</h3><p>Candidate lower bounds 0.93 precision / 0.75 recall need accepted sampling and independent labels. Browser, accessibility, security, challenge/correction and latency gates remain open.</p></section><p class="mt-4">T-PS · Not release validated</p><ul class="mt-4 space-y-2"><li><a class="underline" href="/reference/taxonomy.md">taxonomy.md</a></li><li><a class="underline" href="/reference/signals.md">signals.md</a></li><li><a class="underline" href="/reference/evidence-resistance.md">evidence-resistance.md</a></li><li><a class="underline" href="/reference/evidence-resistance.json">evidence-resistance.json</a></li><li><a class="underline" href="/reference/command-stress.json">command-stress.json</a></li><li><a class="underline" href="/reference/context-v6-service.json">context-v6-service.json</a></li><li><a class="underline" href="/reference/PS-01.md">PS-01.md</a></li><li><a class="underline" href="/reference/PS-01-acceptance.md">PS-01-acceptance.md</a></li><li><a class="underline" href="/reference/regression-gates.json">regression-gates.json</a></li><li><a class="underline" href="/reference/live-gap-implementation.json">live-gap-implementation.json</a></li><li><a class="underline" href="/reference/browser-checks.json">browser-checks.json</a></li><li><a class="underline" href="/reference/extension-integration.json">extension-integration.json</a></li><li><a class="underline" href="/reference/ps_v1.jsonl">ps_v1.jsonl</a></li><li><a class="underline" href="/reference/fetch_execute_v1.jsonl">fetch_execute_v1.jsonl</a></li><li><a class="underline" href="/reference/counterexamples_v2.jsonl">counterexamples_v2.jsonl</a></li><li><a class="underline" href="/reference/live_gap_v1.jsonl">live_gap_v1.jsonl</a></li><li><a class="underline" href="/reference/routing_boundaries_v1.jsonl">routing_boundaries_v1.jsonl</a></li><li><a class="underline" href="/reference/ps-routing-regressions.json">ps-routing-regressions.json</a></li><li><a class="underline" href="/reference/ps-routing-gates.json">ps-routing-gates.json</a></li><li><a class="underline" href="/reference/independent-review.md">independent-review.md</a></li><li><a class="underline" href="/reference/bounded-service-conformance.json">bounded-service-conformance.json</a></li><li><a class="underline" href="/reference/service-resource-faults.json">service-resource-faults.json</a></li></ul></div></details><details class="rounded-xl border border-line bg-surface p-4"><summary class="cursor-pointer"><span class="block font-sans text-2xl font-semibold">PII</span></summary><div class="mt-4"><h2 class="mb-2 text-xl font-bold">Personal information redacted</h2><p class="mb-4">Building Now</p><p data-tag-availability class="mb-3 text-left text-xs text-muted">Local setup required. PII does not run in this website checker.</p><p data-tag-summary class="text-left">Keep detected personal details out of the local checker.</p><p data-tag-example class="mt-2"><strong>For example:</strong> An answer includes an email address. The local service can remove detected values before checking the rest of the text.</p><p class="mt-2 text-sm text-muted">Some sensitive details can be missed. This tag does not mean all private information is gone.</p><section data-tag-usage><h2>Use this tag</h2><p>Check a draft with your own local redactor before you share it. Review the result and make any edits yourself. This is a local-service preview, separate from the website’s on-device PS checker.</p><p class="mt-2 text-sm text-muted">Developer preview: Linux, Python 3.12+ and an installed, working Podman engine. First setup downloads pinned dependencies. Read the full guide for private build-network options and the older manual Docker Compose path. This command does not install an engine; no Chrome Web Store release is offered.</p><p class="mt-3"><a href="https://github.com/knwvmbrr/aitrust-id/archive/refs/heads/main.zip">Download source</a> · <a href="https://github.com/knwvmbrr/aitrust-id/blob/main/docs/open-validation-path.md">Full setup guide</a></p><ol class="mt-3 list-decimal space-y-3 pl-5"><li><h3 class="font-semibold">Get the source</h3><p>Download and unzip the source, then open its folder. Or use Git:</p><pre tabindex="0" class="my-2 overflow-x-auto rounded-lg border border-line bg-canvas p-3 text-sm"><code>git clone https://github.com/knwvmbrr/aitrust-id.git
cd aitrust-id</code></pre></li><li><h3 class="font-semibold">Start your own checker</h3><p>On Linux with Python 3.12+ and a working Podman engine, run this from the source folder. It creates a private installation and checks that it works:</p><pre tabindex="0" class="my-2 overflow-x-auto rounded-lg border border-line bg-canvas p-3 text-sm"><code>python3 scripts/setup-local.py --engine podman</code></pre></li><li><h3 class="font-semibold">Review a draft before sharing</h3><p>Save text as draft.txt. This optional privacy check uses your local redactor and does not depend on PS. It does not edit or send the draft:</p><pre tabindex="0" class="my-2 overflow-x-auto rounded-lg border border-line bg-canvas p-3 text-sm"><code>LOCAL_STATE=&quot;$HOME/.config/aitrust-id/local-stack&quot;
&quot;$LOCAL_STATE/checker/bin/python&quot; scripts/aitrust.py privacy draft.txt --env-file &quot;$LOCAL_STATE/runtime.env&quot;</code></pre></li></ol><p class="mt-3">A finding means supported detections were masked during this local check. Your original draft is unchanged. No finding does not mean all private details are absent.</p><p class="mt-3">Optional Chrome tags: follow docs/gateway-authentication.md in the downloaded repository to set up gateway signing. Open chrome://extensions, enable Developer mode, choose Load unpacked and select the extension folder. In its settings, choose your gateway public-key JSON, confirm its fingerprint separately and enter your local token. Turn on Enable checks on ChatGPT when ready. Keep your services running. Tags appear below supported answers; click for a short explanation. Unsigned or altered results stay unavailable. Pause or reset at any time.</p><p class="mt-3">Your answer goes to your own local service, not this website or a training database. Keep your token private. Do not paste it into a public report.</p><p class="mt-3"><a href="https://github.com/knwvmbrr/aitrust-id/blob/main/docs/assertion-replay.md">Repeat a saved local-service check</a>. This compares your saved findings against the same method; it does not send research data to us.</p><h3 class="mt-3 font-semibold">Stop the checker</h3><pre tabindex="0" class="my-2 overflow-x-auto rounded-lg border border-line bg-canvas p-3 text-sm"><code>python3 scripts/setup-local.py --engine podman --stop</code></pre></section><section data-tag-performance="PII_REDACTED" aria-label="Tag performance" class="my-4 rounded-xl border border-line p-4"><div class="flex flex-wrap justify-between gap-2"><h2 class="text-sm font-semibold">Performance</h2><span class="text-xs text-muted">Working preview</span></div><p class="mt-1 text-sm">English redaction development checks · not independent validation</p><details data-redaction-recognition class="mt-3"><summary class="min-h-11 cursor 3 class="mb-2 font-bold">Validation</h3><p>No support contract has been offered, priced or honoured. The disclosure channels above are live and documented.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Cost</h3><p>Proposed paid organization offering. Pricing is not set, there is no checkout, and no subscription or contract is available. The personal detection, evidence and verification capabilities stay free and open.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Privacy</h3><p>An issue report can contain the content someone was checking, which is why neither original nor redacted content should be attached to a public report. Support correspondence is not a content store and must not become one.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Dependencies</h3><ul class="list-disc pl-5"><li>Operations ownership (WP-OPERATIONS)</li><li>Published site and contact surface (WP-SITE)</li></ul></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Failure</h3><p>A failed or unsupported organization capability must not become a finding, and must not disable the personal workflow or any unrelated tag.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Owner</h3><p>Maintainers own implementation; independent reviewers own validation; the product owner accepts release and any organization commitment.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Release requirements</h3><p>Name support owners and escalation routes, verify coverage, and test the commitments before offering a contract. Check failure handling (F-096) so a service problem cannot turn into a misleading finding.</p></section><p class="mt-4">F-163 · Not release validated</p><ul class="mt-4 space-y-2"><li><a class="underline" href="/reference/public-scope.json">public-scope.json</a></li></ul></div></details><details class="rounded-xl border border-line bg-surface p-4"><summary class="cursor-pointer"><span class="block font-sans text-2xl font-semibold">PRIVATE</span></summary><div class="mt-4"><h2 class="mb-2 text-xl font-bold">Proprietary tag package</h2><p class="mb-4">Coming Soon</p><p data-tag-availability class="mb-3 text-left text-xs text-muted">Planned offering. No team service is running.</p><p data-tag-summary class="text-left">Add your team’s policies without changing the public meaning of a tag.</p><p data-tag-example class="mt-2"><strong>For example:</strong> A team could require an extra review while keeping the tag’s evidence and limits visible.</p><p class="mt-2 text-sm text-muted">Planned. Private rules must not weaken or misrepresent the public standard.</p><section data-tag-usage><h2>What you can do</h2><p>Open the local practice guide in How it works. Read its invented policy before checking the example; share requirements without confidential documents.</p><p data-tag-today class="mt-3">Use the local organization policy practice guide on Mac or Linux. Enroll separate tenants, grant limited permissions, select a reviewed job, pause or restore access, export privately and remove the registry. Nothing is uploaded. The hosted organization service is still planned.</p></section><section data-tag-performance="proprietary" aria-label="Tag performance" class="my-4 rounded-xl border border-line p-4"><div class="flex flex-wrap justify-between gap-2"><h2 class="text-sm font-semibold">Performance</h2><span class="text-xs text-muted">Not running</span></div><p class="mt-1 text-sm">Organization capability; performance not measured.</p><p class="mt-2 text-xs text-muted">Independent release validation: pending.</p><p class="mt-2 text-xs"><strong>Next test:</strong> Test private-policy boundaries without weakening public tag standards.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Job</h3><p>Define organization-specific tag workflows and policy extensions.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Outcome</h3><p>Apply a private policy with clear provenance and claim boundaries.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Claim</h3><p>A private extension capability, bounded so that a private policy can add obligations but never weaken a public claim.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Method</h3><p>An optional local registry separates tenant namespaces, credentials, policy revisions and permissions for each literal-policy job. Private rules cannot change public tag methods. A hosted organization service is planned.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Input</h3><p>A local operator authority, tenant credential, reviewed policy, private text file and a selection binding the exact job and revision. The practice example is invented.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Output</h3><p>A brief occurrence count, or optional permission-controlled private details for the selected tenant, job and revision. Local authority is checked; real organization ownership is not verified. A match is not a policy-violation verdict.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Supported scope</h3><ul class="list-disc pl-5"><li>Available now — separate local tenant authority and per-job selections</li><li>Available now — limited credentials, revision binding, pause and revocation</li><li>Available now — permission-controlled exports and isolated literal-policy checks</li><li>Required before sale — agreed ownership, licensing and the actual customer scope</li></ul></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Limits</h3><ul class="list-disc pl-5"><li>Display names here are offering names, not adopted standard codes</li><li>A private policy must not dilute or misrepresent the public standard, and must never reuse a public tag code for a different claim</li><li>A private extension is not a private fork of the evidence standard; thresholds move one way only, upward</li><li>Underlying personal detection and evidence remain free</li></ul></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Validation</h3><p>The governed local registry passed 27 control groups and 73 actual command checks on both Mac and isolated Linux. A separate review accepted the original software boundaries. These results do not verify real organization identity, employee consent, commercial terms or independent accuracy.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Cost</h3><p>Proposed paid organization offering. Pricing is not set, there is no checkout, and no subscription or contract is available. The personal detection, evidence and verification capabilities stay free and open.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Privacy</h3><p>A private policy must preserve consent and the public privacy commitments. Team payment does not waive no-telemetry (F-086) or capture boundaries (F-087) for the people whose content is checked.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Dependencies</h3><ul class="list-disc pl-5"><li>Accepted privacy terms (WP-PRIVACY)</li><li>Record version contract (WP-PROTOCOL)</li><li>Independent validation (WP-VALIDATION)</li></ul></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Failure</h3><p>A failed or unsupported organization capability must not become a finding, and must not disable the personal workflow or any unrelated tag.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Owner</h3><p>Maintainers own implementation; independent reviewers own validation; the product owner accepts release and any organization commitment.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Release requirements</h3><p>The local software boundaries are accepted. Before a commercial service or sale, agree the actual customer scope, ownership and licensing, and complete the applicable consent, deployment and conformance checks. Future private policies each need their own validation.</p></section><p class="mt-4">N-010 · Not release validated</p><ul class="mt-4 space-y-2"><li><a class="underline" href="/reference/public-scope.json">public-scope.json</a></li><li><a class="underline" href="/reference/organization-policy-registry.md">organization-policy-registry.md</a></li><li><a class="underline" href="/reference/organization-policy-acceptance.md">organization-policy-acceptance.md</a></li></ul></div></details></section><footer class="mt-12 border-t border-line py-6"><p>AI TRUST ID · Every tag must pass its own published validation gate before release.</p><p class="mt-3">Published by AI Trust ID.</p><p class="mt-4">No automatic report upload or research collection is enabled. Public development discussion is on GitHub.</p><a class="mt-4 block underline" href="/tags/">Tag reference</a><a class="mt-4 block underline" href="/reference/operate/">Start with PS</a><a class="mt-4 block underline" href="/reference/legal-drafts/">Legal drafts</a><a class="mt-4 block underline" href="/reference/changelog.md" download="AI-Trust-ID-changelog.md">Changelog</a><a class="mt-4 block underline" href="/policies/">Public terms and policies</a><a class="mt-4 block underline" href="/runtime-js-sources/NOTICES.txt">Browser runtime notices</a><a class="mt-4 block underline" href="/runtime-js-sources/PYODIDE-JS-SOURCES.zip">Selected JS source</a><a class="mt-4 block underline" href="/runtime-zlib-sources/NOTICES.txt">Embedded-library notices</a><a class="mt-4 block underline" href="/runtime-zlib-sources/ZLIB-SOURCES.zip">Zlib source</a><a class="mt-4 block underline" href="/referenc
