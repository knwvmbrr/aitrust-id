h3><p>A supported command-risk pattern was found. The adopted PS name previously overclaimed scam detection; this preview uses a bounded explanation.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Method</h3><p>Local lexical matching. Substitution methods check stdout routing and the execution layer; supported comments, immediate warnings and literal display forms are excluded. No payload is fetched or executed. The evaluator source hash identifies the exact method.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Input</h3><p>Text, currently through the Chrome/ChatGPT development adapter and authenticated local gateway.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Output</h3><p>A versioned tag record with subject binding, method, evidence, limitations, and a result state.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Supported scope</h3><ul class="list-disc pl-5"><li>curl or wget piped to sh or bash, with optional sudo</li><li>Bounded curl/wget stdout command, process and backtick substitution into supported execution commands</li><li>eval/exec receiving base64.b64decode, atob, or bytes.fromhex</li><li>Exact spans in normalized redactor output</li></ul></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Limits</h3><ul class="list-disc pl-5"><li>Does not identify a scam, malicious intent, or human/AI authorship</li><li>Does not execute commands or parse every shell/language form</li><li>Some quotations and mixed contexts may still trigger</li><li>No finding is not a safety clearance; one live Homebrew response verified, broader live-site coverage remains open</li></ul></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Validation</h3><p>Development regression: 24 examples, TP 10 / FP 0 / FN 0 / TN 14. Not an independent holdout. 95% Wilson lower bounds: 0.722 for precision and recall; candidate gates fail. Additional reviewer counterexamples, schema/HTTP checks, observed-DOM race checks and real local extension integration pass; these do not estimate independent accuracy.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Cost</h3><p>Free personal workflow. No paid detector, evidence, or verification gate.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Privacy</h3><p>This catalogue does not evaluate your content. The personal reference implementation uses local services; detected redaction can miss sensitive information.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Dependencies</h3><ul class="list-disc pl-5"><li>Versioned claim and evidence contract</li><li>Independent review for this tag</li><li>Accessible presentation and a clear failure state</li><li>Local redaction before evaluation</li><li>Independent use/mention labels</li></ul></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Failure</h3><p>A failed or unsupported check must not become a finding. A problem with this tag must not disable unrelated tags.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Owner</h3><p>Maintainers own implementation; independent reviewers own validation; the product owner accepts release.</p></section><section class="border-t border-line py-4"><h3 class="mb-2 font-bold">Release requirements</h3><p>Candidate lower bounds 0.93 precision / 0.75 recall need accepted sampling and independent labels. Browser, accessibility, security, challenge/correction and latency gates remain open.</p></section><p class="mt-4">T-PS · Not release validated</p><ul class="mt-4 space-y-2"><li><a class="underline" href="/reference/taxonomy.md">taxonomy.md</a></li><li><a class="underline" href="/reference/signals.md">signals.md</a></li><li><a class="underline" href="/reference/PS-01.md">PS-01.md</a></li>
