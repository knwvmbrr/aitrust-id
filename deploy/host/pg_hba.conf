# PostgreSQL OS administrator; no password or TCP authentication paths.
local all postgres peer
local aitrustid aitrust_reader peer map=aitrustid
local aitrustid aitrust_intake peer map=aitrustid
local aitrustid aitrust_reviewer peer map=aitrustid
local all all reject
host all all 0.0.0.0/0 reject
host all all ::0/0 reject
